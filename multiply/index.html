<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>곱셈 몬스터</title>
<meta name="theme-color" content="#f4ecd8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
:root{--bg:#f4ecd8;--ink:#2a2a33;--card:#fffdf6;--edge:#dccfae;--accent:#e4572e;--good:#2f8f4e;--blue:#3b6fd8;
  --font:"Jua","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;--vh:1vh}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--ink);
  font-family:var(--font);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;color-scheme:light}
button,a{font-family:inherit;color:inherit}
#app{height:calc(var(--vh)*100);display:flex;gap:12px;padding:10px}
#left{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
#right{width:330px;display:flex;flex-direction:column;gap:8px}
.box{background:var(--card);border-radius:18px;border:2px solid var(--edge)}
#head{display:flex;gap:8px;flex-wrap:wrap}
.chip2{flex:1;min-width:0;padding:8px 10px;font-size:15px;text-align:center;white-space:nowrap}
.chip2.low{background:#fff0c9;border-color:#e0a100}
#scene{position:relative;height:178px;display:flex;align-items:center;justify-content:center;gap:16px;overflow:hidden;
  background:linear-gradient(#cfe9ff,#eaf6ff 60%,#bfe3a8 60%,#a5d68a)}
#mon{width:150px;height:150px}
#mon svg{width:100%;height:100%;overflow:visible}
.m-idle{animation:bob 1.7s ease-in-out infinite}
.m-hurt{animation:hit .55s}
.m-laugh{animation:hop .6s}
.m-dead{animation:die 1s forwards}
@keyframes bob{50%{transform:translateY(-8px) scale(1.03,.97)}}
@keyframes hit{0%{transform:translateX(0)}15%{transform:translateX(-14px) rotate(-6deg)}35%{transform:translateX(14px) rotate(6deg)}55%{transform:translateX(-10px)}75%{transform:translateX(8px)}100%{transform:none}}
@keyframes hop{30%{transform:translateY(-26px)}60%{transform:translateY(0) scale(1.08,.9)}100%{transform:none}}
@keyframes die{0%{transform:none;opacity:1}40%{transform:rotate(-12deg) scale(1.1)}100%{transform:translateY(40px) rotate(160deg) scale(.1);opacity:0}}
#hpwrap{width:210px}
#hpwrap .lbl{font-size:15px;margin-bottom:4px}
#hp{height:22px;border-radius:12px;background:#fff;border:3px solid #6b4f3a;overflow:hidden}
#hp i{display:block;height:100%;background:linear-gradient(#ff8a8a,#e84a4a);transition:width .5s}
#dots{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
#dots i{width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid #6b4f3a}
#dots i.on{background:#ffd23f}
#streak{position:absolute;right:12px;top:10px;font-size:20px;color:#d9480f;background:#fff;border-radius:14px;padding:3px 10px;display:none}
.star{position:absolute;left:50%;top:50%;font-size:28px;pointer-events:none;color:#ffc400;animation:burst .9s ease-out forwards}
@keyframes burst{0%{transform:translate(-50%,-50%) scale(.4);opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.3) rotate(240deg);opacity:0}}
#prob{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:8px 12px;text-align:center}
.eq{font-size:86px;line-height:1;white-space:nowrap}
.eq .a{display:inline-block;min-width:1.7em;border-bottom:6px solid var(--blue);color:var(--blue);padding:0 .1em;animation:none}
.eq.sm{font-size:50px}
#msg{min-height:34px;font-size:23px}
#msg.ok{color:var(--good)} #msg.no{color:#c2410c}
.am{display:flex;gap:10px;width:100%;max-width:520px}
.blk{border-radius:14px;padding:8px 6px;border:3px solid #8aa;background:#eef5ff;font-size:22px}
.blk.t{flex:7;background:#e6f0ff;border-color:#6d9be0}.blk.o{flex:3;background:#fff1de;border-color:#e0a25a}
.blk b{display:block;font-size:30px;font-weight:400}
.blk.cur{box-shadow:0 0 0 5px rgba(255,196,0,.7)}
.blk.done{background:#e3f5e7;border-color:var(--good)}
#pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;flex:1;min-height:0}
#pad button{border:0;border-radius:18px;background:#fff;box-shadow:0 5px 0 var(--edge);font-size:38px;cursor:pointer;min-height:56px}
#pad button:active{transform:translateY(4px);box-shadow:0 1px 0 var(--edge)}
#pad .ok{background:var(--good);color:#fff;box-shadow:0 5px 0 #20703a}
#pad .del{background:#fff3e0}
#mini{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.mini{min-height:54px;border:0;border-radius:14px;background:#fff;box-shadow:0 4px 0 var(--edge);font-size:13px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.25;padding:2px}
.mini:active{transform:translateY(3px);box-shadow:0 1px 0 var(--edge)}
.mini.hl{background:#fff1b8;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
.mini small{font-size:11px;opacity:.6}
.mini.holdable{background-image:linear-gradient(#ffcf70,#ffcf70);background-repeat:no-repeat;background-size:0 100%}
.mini.hold{background-size:100% 100%;transition:background-size .9s linear}
#overlay{position:fixed;inset:0;background:rgba(40,35,25,.55);display:none;align-items:center;justify-content:center;padding:12px;z-index:5}
#overlay.on{display:flex}
.card{background:var(--card);border-radius:24px;padding:18px 22px;width:min(600px,100%);max-height:100%;overflow:auto;text-align:center;box-shadow:0 8px 0 rgba(0,0,0,.18)}
.card h1{margin:0 0 8px;font-size:32px}.card h2{margin:0 0 8px;font-size:28px}
.lvs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.lv{border:3px solid var(--edge);border-radius:18px;background:#fff;padding:10px 8px;cursor:pointer;font-size:19px;line-height:1.3}
.lv small{display:block;font-size:14px;opacity:.65}
.lv .stars{font-size:20px;color:#ffb400;min-height:26px}
.lv:active{transform:translateY(3px)}
.lv.rec{border-color:var(--good);background:#e8f7ec}
.go{width:100%;min-height:60px;margin-top:8px;border:0;border-radius:18px;background:var(--good);color:#fff;font-size:24px;box-shadow:0 5px 0 #20703a;cursor:pointer;display:block;text-align:center;text-decoration:none;line-height:60px;padding:0}
.go.alt{background:#fff;color:var(--ink);box-shadow:0 5px 0 var(--edge);font-size:20px;min-height:52px;line-height:52px;margin-top:10px}
.links{display:flex;gap:8px}.links .go{margin-top:10px}
.big{font-size:60px;line-height:1.1}
.bigstars{font-size:60px;color:#ffb400;letter-spacing:6px}
.sub{font-size:16px;opacity:.75;margin:4px 0}
@media (orientation:portrait){
  #app{flex-direction:column;gap:8px}
  #right{width:100%;flex:none;height:min(48%,430px)}
  #scene{height:150px} #mon{width:124px;height:124px}
  .eq{font-size:68px} .eq.sm{font-size:42px}
  #hpwrap{width:180px}
}
@media (max-height:520px) and (orientation:landscape){#scene{height:150px}#mon{width:124px;height:124px}.eq{font-size:70px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div id="app">
  <div id="left">
    <div id="head">
      <div class="box chip2" id="lvName"></div>
      <div class="box chip2" id="rec"></div>
      <div class="box chip2" id="timeBox"></div>
    </div>
    <div id="scene" class="box">
      <div id="mon"></div>
      <div id="hpwrap"><div class="lbl" id="hpl">몬스터 체력</div><div id="hp"><i id="hpf" style="width:100%"></i></div><div id="dots"></div></div>
      <div id="streak"></div>
    </div>
    <div id="prob" class="box"></div>
  </div>
  <div id="right">
    <div id="pad"></div>
    <div id="mini">
      <button class="mini" id="bHint">💡<span>쪼개서 풀기</span></button>
      <button class="mini" id="bMenu">☰<span>메뉴</span></button>
      <button class="mini" id="bSound">🔊<span>소리</span></button>
      <button class="mini holdable" id="bParent">👪<span>부모님</span><small>꾹 누르기</small></button>
    </div>
  </div>
</div>
<div id="overlay"></div>
<script src="../algakki/guard.js"></script>
<script>
(function(){
const $=id=>document.getElementById(id);
const LS=Guard.LS, rand=n=>Math.floor(Math.random()*n);
const LV={1:{n:'올림 없는 곱셈',ex:'21 × 4'},2:{n:'올림 한 번',ex:'14 × 6'},3:{n:'100 넘는 곱셈',ex:'47 × 6'},4:{n:'섞어서 도전',ex:'여러 가지'}};
let level=LS.get('mult.level',2), qs=[], cur=null, input='', phase='menu', R=null, mood='idle', msgT='', msgC='', muted=false, overlayMode='';
const TOTAL=10;

/* ---------- sound ---------- */
let AC;
function unlock(){ try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume(); }catch(e){} }
function tone(f0,f1,d,type,v,delay){
  if(muted) return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const t0=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();
    o.type=type||'sine'; o.frequency.setValueAtTime(f0,t0); if(f1!==f0) o.frequency.exponentialRampToValueAtTime(f1,t0+d);
    g.gain.setValueAtTime(v||.08,t0); g.gain.exponentialRampToValueAtTime(.0001,t0+d);
    o.connect(g); g.connect(AC.destination); o.start(t0); o.stop(t0+d);
  }catch(e){}
}
const sfx={
  key:()=>tone(620,620,.04,'triangle',.04),
  step:()=>{tone(600,600,.1,'triangle');tone(800,800,.12,'triangle',.08,.09)},
  ok:()=>{tone(660,660,.12,'triangle',.09);tone(880,880,.18,'triangle',.09,.1);tone(1175,1175,.22,'triangle',.08,.2)},
  hit:()=>tone(260,90,.25,'square',.06),
  no:()=>tone(230,170,.22,'sawtooth',.045),
  win:()=>[523,659,784,1046,1318].forEach((f,i)=>tone(f,f,.22,'triangle',.09,i*.13))
};

/* ---------- stats ---------- */
const SCK='score.mult';
const getStats=()=>LS.get(SCK,null)||{r:0,w:0};
const bump=k=>{ const s=getStats(); s[k]++; LS.set(SCK,s); };
const getStars=()=>LS.get('mult.stars',null)||{};
function renderHead(){
  const s=getStats();
  $('lvName').textContent='Lv'+level+' '+LV[level].n;
  $('rec').textContent='🏆 정답 '+s.r+' : 오답 '+s.w;
}

/* ---------- questions ---------- */
function genQ(lv){
  for(;;){
    const L=lv===4?1+rand(3):lv;
    const b=2+rand(8),t=1+rand(9),o=1+rand(9),a=t*10+o,oneP=o*b,carry=Math.floor(oneP/10),tensSum=t*b+carry;
    const ok=L===1?(oneP<10&&t*b<10):L===2?(oneP>=10&&tensSum<10):tensSum>=10;
    if(ok) return {a,b,t,o,ans:a*b,app:0};
  }
}
function genRound(lv){
  const seen=new Set(),out=[];
  while(out.length<TOTAL){ const q=genQ(lv),k=q.a+'x'+q.b; if(seen.has(k)) continue; seen.add(k); out.push(q); }
  return out;
}

/* ---------- monster ---------- */
function monsterSVG(lv,m){
  const C={1:['#a6ec9f','#4cb85a'],2:['#a9d4ff','#4a90e2'],3:['#ffcb8a','#e8822a'],4:['#e0b5ff','#9b5de5']}[lv];
  const x=(cx,cy)=>'<path d="M'+(cx-7)+' '+(cy-7)+'L'+(cx+7)+' '+(cy+7)+'M'+(cx+7)+' '+(cy-7)+'L'+(cx-7)+' '+(cy+7)+'" stroke="#2a2a33" stroke-width="5" stroke-linecap="round"/>';
  const eye=(cx,cy)=>'<circle cx="'+cx+'" cy="'+cy+'" r="15" fill="#fff"/><circle cx="'+(cx+2)+'" cy="'+(cy+2)+'" r="7" fill="#2a2a33"/><circle cx="'+(cx+5)+'" cy="'+(cy-1)+'" r="2.5" fill="#fff"/>';
  const eyes=(m==='hurt'||m==='dead')?x(75,92)+x(125,92):eye(75,92)+eye(125,92);
  const mouth=m==='laugh'?'<path d="M72 120 Q100 160 128 120Z" fill="#7a1f2b"/><path d="M86 140 Q100 150 114 140 Q100 132 86 140Z" fill="#ff8aa0"/>'
    :(m==='hurt'||m==='dead')?'<path d="M80 134 q10 -10 20 0 q10 10 20 0" fill="none" stroke="#2a2a33" stroke-width="5" stroke-linecap="round"/>'
    :'<path d="M78 124 Q100 146 122 124" fill="none" stroke="#2a2a33" stroke-width="5" stroke-linecap="round"/>';
  return '<svg viewBox="0 0 200 180"><defs><radialGradient id="mg" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="'+C[0]+'"/><stop offset="1" stop-color="'+C[1]+'"/></radialGradient></defs>'
    +'<ellipse cx="100" cy="168" rx="62" ry="9" fill="rgba(0,0,0,.18)"/>'
    +'<path d="M42 62 L30 22 L72 48Z M158 62 L170 22 L128 48Z" fill="'+C[1]+'" stroke="#2a2a33" stroke-width="3" stroke-linejoin="round"/>'
    +'<ellipse cx="100" cy="106" rx="78" ry="66" fill="url(#mg)" stroke="#2a2a33" stroke-width="4"/>'
    +'<ellipse cx="68" cy="66" rx="18" ry="9" fill="rgba(255,255,255,.45)" transform="rotate(-25 68 66)"/>'
    +eyes+'<circle cx="52" cy="118" r="9" fill="rgba(255,120,140,.5)"/><circle cx="148" cy="118" r="9" fill="rgba(255,120,140,.5)"/>'+mouth+'</svg>';
}
function setMood(m,ms){
  mood=m; const el=$('mon'); el.innerHTML=monsterSVG(level,m); el.className='m-'+m;
  if(ms&&m!=='dead') setTimeout(()=>{ if(mood===m) setMood('idle'); },ms);
}
function burst(n){
  const sc=$('scene');
  for(let i=0;i<n;i++){
    const s=document.createElement('span'); s.className='star'; s.textContent='★';
    const a=Math.random()*6.283,d=70+Math.random()*80;
    s.style.setProperty('--dx',Math.cos(a)*d+'px'); s.style.setProperty('--dy',Math.sin(a)*d+'px');
    s.style.left=(30+Math.random()*20)+'%'; s.style.color=['#ffc400','#ff6b9d','#35b6ff','#5fd06a'][i%4];
    sc.appendChild(s); setTimeout(()=>s.remove(),950);
  }
}

/* ---------- render ---------- */
function renderPad(){
  let h='';
  for(const k of ['1','2','3','4','5','6','7','8','9','⌫','0','확인']) h+='<button data-k="'+k+'" class="'+(k==='⌫'?'del':k==='확인'?'ok':'')+'">'+k+'</button>';
  $('pad').innerHTML=h;
}
function say(t,c){ msgT=t; msgC=c||''; const m=$('msg'); if(m){ m.textContent=t; m.className=c||''; } }
function render(){
  renderHead();
  if(!R){ return; }
  const left=TOTAL-R.cleared;
  $('hpf').style.width=(left/TOTAL*100)+'%';
  $('hpl').textContent='몬스터 체력 '+left+'/'+TOTAL;
  let d=''; for(let i=0;i<TOTAL;i++) d+='<i class="'+(i<R.cleared?'on':'')+'"></i>'; $('dots').innerHTML=d;
  const st=$('streak'); if(R.streak>=2){ st.style.display='block'; st.textContent='🔥 '+R.streak+'연속!'; } else st.style.display='none';
  let h='';
  const ans=input===''?'?':input;
  if(!cur){ $('prob').innerHTML=''; return; }
  if(!cur.guided){
    h+='<div class="eq">'+cur.a+' × '+cur.b+' = <span class="a">'+ans+'</span></div>';
  }else{
    const g=cur.guided,s=g.steps;
    h+='<div class="eq sm">'+cur.a+' × '+cur.b+' = ?</div>';
    h+='<div class="am"><div class="blk t'+(g.i===0?' cur':'')+(s[0].done?' done':'')+'"><b>'+cur.t*10+'</b>'+cur.t*10+' × '+cur.b+' = '+(s[0].done?s[0].ans:(g.i===0?'<u>'+ans+'</u>':'?'))+'</div>'
      +'<div class="blk o'+(g.i===1?' cur':'')+(s[1].done?' done':'')+'"><b>'+cur.o+'</b>'+cur.o+' × '+cur.b+' = '+(s[1].done?s[1].ans:(g.i===1?'<u>'+ans+'</u>':'?'))+'</div></div>';
    if(g.i===2) h+='<div class="eq sm">'+s[0].ans+' + '+s[1].ans+' = <span class="a">'+ans+'</span></div>';
    else h+='<div class="eq sm" style="font-size:34px;opacity:.55">'+(s[0].done?s[0].ans:'?')+' + '+(s[1].done?s[1].ans:'?')+' = ?</div>';
  }
  h+='<div id="msg" class="'+msgC+'">'+msgT+'</div>';
  $('prob').innerHTML=h;
  $('bHint').className='mini'+((cur.tries===1&&!cur.guided&&phase==='ask')?' hl':'');
  $('bSound').innerHTML=(muted?'🔇':'🔊')+'<span>'+(muted?'소리 꺼짐':'소리')+'</span>';
}

/* ---------- flow ---------- */
function startRound(lv){
  level=lv; LS.set('mult.level',lv);
  qs=genRound(lv); R={cleared:0,first:0,streak:0,best:0};
  closeOverlay(); phase='ask'; setMood('idle'); nextQ();
}
function nextQ(){
  if(!qs.length){ endRound(); return; }
  cur=qs.shift(); cur.app++; cur.tries=0; cur.guided=null; input=''; phase='ask';
  say('곱셈을 풀어 보세요!',''); render();
}
function startGuided(){
  const p1=cur.t*10*cur.b,p2=cur.o*cur.b;
  cur.guided={i:0,steps:[{ans:p1},{ans:p2},{ans:cur.ans}]}; input=''; cur.helped=true;
  say(cur.a+' = '+cur.t*10+' + '+cur.o+' 으로 쪼개요!','ok'); render();
}
function wrong(){
  cur.tries++; R.streak=0; bump('w'); sfx.no(); input='';
  setMood('laugh',650);
  if(cur.guided) say('다시 계산해 봐요 ✏️','no');
  else if(cur.tries===1) say('아쉬워요! 한 번 더 해 볼까요? (💡로 쪼개서 풀 수 있어요)','no');
  else { startGuided(); say('쪼개서 같이 풀어 봐요! '+cur.t*10+' × '+cur.b+' 부터!','no'); return; }
  render();
}
function submit(){
  if(phase!=='ask'||input==='') return;
  const val=+input,g=cur.guided,target=g?g.steps[g.i].ans:cur.ans;
  if(val!==target){ wrong(); return; }
  if(g&&g.i<g.steps.length-1){ g.steps[g.i].done=true; g.i++; input=''; sfx.step(); say(g.i===1?'좋아요! 이번엔 '+cur.o+' × '+cur.b:'마지막! 두 수를 더해요','ok'); render(); return; }
  solved();
}
function solved(){
  const helped=!!cur.guided||cur.tries>0;
  phase='fb'; bump('r'); input=String(cur.ans);
  let clear=false;
  if(!helped){ clear=true; if(cur.app===1) R.first++; R.streak++; R.best=Math.max(R.best,R.streak); }
  else if(cur.app>=2) clear=true;
  if(clear){
    R.cleared++; sfx.ok(); sfx.hit(); burst(8); setMood('hurt',600);
    say(!helped?'정답! 🎉 '+(R.streak>=3?R.streak+'연속!':'멋져요'):'잘했어요! 👏','ok');
  }else{
    sfx.step(); say('잘했어요! 이 문제는 나중에 한 번 더 나와요 😉','ok');
    qs.push({a:cur.a,b:cur.b,t:cur.t,o:cur.o,ans:cur.ans,app:cur.app});
  }
  render();
  const id=R;
  setTimeout(()=>{ if(R===id&&phase==='fb') nextQ(); },clear?1100:1500);
}
function endRound(){
  phase='end'; cur=null; render();
  setMood('dead');
  const stars=R.first>=9?3:R.first>=7?2:R.first>=4?1:0;
  const all=getStars(); if(stars>(all[level]||0)){ all[level]=stars; LS.set('mult.stars',all); }
  setTimeout(()=>{ sfx.win(); burst(14); showEnd(stars); },1000);
}

/* ---------- overlays ---------- */
function openOverlay(h,m){ overlayMode=m; const o=$('overlay'); o.innerHTML='<div class="card">'+h+'</div>'; o.className='on'; }
function closeOverlay(){ overlayMode=''; const o=$('overlay'); o.className=''; o.innerHTML=''; }
function starStr(n){ return '★'.repeat(n)+'☆'.repeat(3-n); }
function showMenu(){
  const all=getStars();
  let h='<h1>✖️ 곱셈 몬스터</h1><div class="sub">10문제를 풀어서 몬스터를 물리쳐요</div><div class="lvs">';
  for(const k of [1,2,3,4]) h+='<button class="lv'+(k===level?' rec':'')+'" data-lv="'+k+'">Lv'+k+' '+LV[k].n+'<small>예: '+LV[k].ex+'</small><div class="stars">'+starStr(all[k]||0)+'</div></button>';
  h+='</div>';
  if(R&&phase==='ask') h+='<button class="go" data-act="close">계속하던 문제로</button>';
  h+='<div class="links"><a class="go alt" href="../">♟ 체스</a><a class="go alt" href="../algakki/">🪨 알까기</a></div>';
  openOverlay(h,'menu');
}
function showEnd(stars){
  const msg=stars===3?'대단해요! 몬스터를 완전히 물리쳤어요!':stars===2?'잘했어요! 몬스터를 물리쳤어요!':stars===1?'몬스터를 물리쳤어요! 한 번 더 하면 더 잘할 수 있어요':'몬스터를 물리쳤어요! 쪼개서 풀기를 연습해 봐요';
  openOverlay('<div class="big">🏆</div><div class="bigstars">'+starStr(stars)+'</div><h2>'+msg+'</h2>'
    +'<div class="sub">처음에 바로 맞힌 문제 '+R.first+'/'+TOTAL+' · 최고 연속 '+R.best+'</div>'
    +'<button class="go" data-act="again">한 번 더 (Lv'+level+')</button>'
    +'<button class="go alt" data-act="menu">레벨 고르기</button>','end');
}
$('overlay').addEventListener('click',e=>{
  unlock();
  const t=e.target.closest('[data-lv],[data-act]'); if(!t) return;
  if(t.dataset.lv){ startRound(+t.dataset.lv); return; }
  const a=t.dataset.act;
  if(a==='again') startRound(level);
  else if(a==='menu') showMenu();
  else if(a==='close') closeOverlay();
});

/* ---------- input ---------- */
function press(k){
  if(phase!=='ask'||overlayMode) return;
  if(k==='⌫') input=input.slice(0,-1);
  else if(k==='확인'){ submit(); return; }
  else if(input.length<4) input+=k;
  sfx.key(); render();
}
$('pad').addEventListener('pointerdown',e=>{ unlock(); const b=e.target.closest('button'); if(b){ e.preventDefault(); press(b.dataset.k); } });
document.addEventListener('keydown',e=>{
  if(/^[0-9]$/.test(e.key)) press(e.key); else if(e.key==='Backspace') press('⌫'); else if(e.key==='Enter') press('확인');
});
$('bHint').addEventListener('click',()=>{ unlock(); if(phase==='ask'&&cur&&!cur.guided&&!overlayMode) startGuided(); });
$('bMenu').addEventListener('click',showMenu);
$('bSound').addEventListener('click',()=>{ muted=!muted; render(); if(!muted){unlock();sfx.step();} });
let holdT=null; const bP=$('bParent');
bP.addEventListener('pointerdown',()=>{ bP.classList.add('hold'); holdT=setTimeout(()=>{ holdT=null; bP.classList.remove('hold'); Guard.parentFlow(); },900); });
['pointerup','pointerleave','pointercancel'].forEach(ev=>bP.addEventListener(ev,()=>{ clearTimeout(holdT); bP.classList.remove('hold'); }));
function vh(){ document.documentElement.style.setProperty('--vh',(window.innerHeight/100)+'px'); }
window.addEventListener('resize',vh); vh();

/* boot */
renderPad(); renderHead(); setMood('idle'); showMenu();
Guard.start({onTick:s=>{ const b=$('timeBox'); b.textContent=Guard.label(s); b.className='box chip2'+(s<=300?' low':''); },onReset:renderHead});
window.__mult={startRound,get cur(){return cur;},get R(){return R;},get phase(){return phase;},get qs(){return qs;},genQ};
})();
</script>
</body>
