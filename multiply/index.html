<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>곱셈 몬스터</title>
<meta name="theme-color" content="#f4ecd8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
:root{--bg:#f4ecd8;--ink:#2a2a33;--card:#fffdf6;--edge:#dccfae;--accent:#e4572e;--good:#2f8f4e;--blue:#3b6fd8;
  --font:"Jua","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;--vh:1vh}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--ink);
  font-family:var(--font);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;color-scheme:light}
button,a{font-family:inherit;color:inherit}
#app{height:calc(var(--vh)*100);display:flex;gap:12px;padding:10px}
#left{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
#right{width:330px;display:flex;flex-direction:column;gap:8px}
.box{background:var(--card);border-radius:18px;border:2px solid var(--edge)}
#head{display:flex;gap:8px;flex-wrap:wrap}
.chip2{flex:1;min-width:0;padding:8px 10px;font-size:15px;text-align:center;white-space:nowrap}
.chip2.low{background:#fff0c9;border-color:#e0a100}
#scene{position:relative;height:130px;display:flex;align-items:center;justify-content:center;gap:16px;overflow:hidden;
  background:linear-gradient(#cfe9ff,#eaf6ff 60%,#bfe3a8 60%,#a5d68a)}
#mon{width:106px;height:106px}
#mon svg{width:100%;height:100%;overflow:visible}
.m-idle{animation:bob 1.7s ease-in-out infinite}
.m-laugh{animation:wob .6s}
.m-evolve{animation:pop .8s}
.m-win{animation:hop .9s ease-in-out infinite}
.glow{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;background:radial-gradient(#fff,#fff6a8 55%,rgba(255,240,120,0));z-index:4;pointer-events:none;animation:glow .9s ease-out forwards}
@keyframes glow{0%{transform:scale(.3);opacity:1}60%{transform:scale(3.2);opacity:.95}100%{transform:scale(4);opacity:0}}
@keyframes pop{0%{transform:scale(.7)}35%{transform:scale(1.28) rotate(-4deg)}60%{transform:scale(.95) rotate(3deg)}100%{transform:none}}
@keyframes wob{0%,100%{transform:none}20%{transform:rotate(-9deg)}50%{transform:rotate(8deg)}75%{transform:rotate(-4deg)}}
#fly{position:fixed;inset:0;z-index:60;background:rgba(255,236,180,.28);overflow:hidden;transition:opacity .35s;touch-action:none}
#fly .fd{position:absolute;left:0;top:0;will-change:transform;filter:drop-shadow(0 8px 6px rgba(0,0,0,.25))}
#fly .fd svg{width:100%;height:100%;overflow:visible}
#fly .ff{position:absolute;margin:-20px 0 0 -20px;line-height:1;pointer-events:none;animation:ff .9s ease-out forwards}
@keyframes ff{0%{transform:translate(0,0) scale(.4) rotate(0);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1.5) rotate(var(--r));opacity:0}}
#dragons{display:flex;gap:6px;margin-top:6px;min-height:0}
#dragons .dr{width:44px;height:42px;display:block}
#dragons svg{width:100%;height:100%;overflow:visible}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bob{50%{transform:translateY(-8px) scale(1.03,.97)}}
@keyframes hit{0%{transform:translateX(0)}15%{transform:translateX(-14px) rotate(-6deg)}35%{transform:translateX(14px) rotate(6deg)}55%{transform:translateX(-10px)}75%{transform:translateX(8px)}100%{transform:none}}
@keyframes hop{30%{transform:translateY(-26px)}60%{transform:translateY(0) scale(1.08,.9)}100%{transform:none}}
#hpwrap{width:210px}
#hpwrap .lbl{font-size:15px;margin-bottom:4px}
#hp{height:22px;border-radius:12px;background:#fff;border:3px solid #6b4f3a;overflow:hidden}
#hp i{display:block;height:100%;background:linear-gradient(#9be28a,#3fae52);transition:width .5s}
#dots{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
#dots i{width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid #6b4f3a}
#dots i.on{background:#ffd23f}
#streak{position:absolute;right:12px;top:10px;font-size:20px;color:#d9480f;background:#fff;border-radius:14px;padding:3px 10px;display:none}
.star{position:absolute;left:50%;top:50%;font-size:28px;pointer-events:none;color:#ffc400;animation:burst .9s ease-out forwards}
@keyframes burst{0%{transform:translate(-50%,-50%) scale(.4);opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.3) rotate(240deg);opacity:0}}
#probwrap{flex:1;min-height:0;position:relative;overflow:hidden}
#prob{position:absolute;inset:0;display:flex;flex-direction:row;align-items:center;justify-content:center;gap:18px;padding:8px 14px}
#pen,#ans{position:absolute;inset:0;width:100%;height:100%}
#pen{touch-action:none;cursor:crosshair;z-index:1}
#ans{pointer-events:none}
#pentools{position:absolute;right:10px;top:10px;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px 10px;z-index:2;max-width:calc(100% - 20px);pointer-events:none}
#pentools .pt,#pentools .sz{pointer-events:auto}
#szrow{pointer-events:none;display:flex;flex-direction:column;align-items:flex-end;gap:6px;width:100%}
.sz{width:42px;height:42px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--edge);background:#fff;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer}
.sz i{display:block;border-radius:50%;background:#2b2b35}
.sz.on{box-shadow:0 0 0 4px #ffc400;background:#fff8d6}
.pt{width:92px;height:76px;border-radius:20px;border:3px solid #fff;box-shadow:0 0 0 2px var(--edge);background:#fff;font-size:32px;line-height:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0;cursor:pointer}
.pt span{font-size:15px}
.pt.on{box-shadow:0 0 0 4px #ffc400}
.eq{font-size:54px;line-height:1;white-space:nowrap}
.eq .a{display:inline-block;min-width:1.7em;border-bottom:6px solid var(--blue);color:var(--blue);padding:0 .1em;animation:none}
.eq.sm{font-size:50px}
#msg{min-height:96px;font-size:21px;line-height:1.35}
#msg.ok{color:var(--good);font-size:clamp(34px,5.2vw,52px);line-height:1.25} #msg.no{color:#c2410c} #msg.hint{color:#2563eb}
.vf{--cs:min(100px,calc((var(--vh)*100 - 240px)/3.62));display:grid;grid-template-columns:repeat(3,var(--cs));flex:none;align-items:center;justify-items:center}
.vf .lab{color:#2563eb;font-size:20px;height:26px;line-height:26px}
.vf .cc{height:calc(var(--cs)*.62);width:100%;display:flex;align-items:center;justify-content:center}
.cell{width:var(--cs);height:var(--cs);display:flex;align-items:center;justify-content:center;font-size:calc(var(--cs)*.62);border:2px dotted #8a8a99;background:#fff;color:var(--ink)}
.cell.fix{border-color:#c9c9d6;background:#fcfcff}
.cell.act{border:3px solid var(--blue);background:#eef4ff;animation:blink 1s ease-in-out infinite}
.cell.good{color:#1d4ed8;border:3px solid #2563eb;background:#e8f0ff}
.cell.bad{color:#c81e1e;border:3px solid #e03131;background:#ffe9e9}
.cell.flash{animation:shake .4s}
.cc .cell.carry{width:calc(var(--cs)*.9);height:calc(var(--cs)*.58);border:0;background:transparent}
.ln{grid-column:1/4;width:100%;height:5px;background:#2a2a33;margin:3px 0}
.side{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:8px;text-align:center}
@keyframes blink{50%{box-shadow:0 0 0 5px rgba(59,111,216,.25)}}
@keyframes shake{25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}
.am{display:flex;gap:10px;width:100%;max-width:520px}
.blk{border-radius:14px;padding:8px 6px;border:3px solid #8aa;background:#eef5ff;font-size:22px}
.blk.t{flex:7;background:#e6f0ff;border-color:#6d9be0}.blk.o{flex:3;background:#fff1de;border-color:#e0a25a}
.blk b{display:block;font-size:30px;font-weight:400}
.blk.cur{box-shadow:0 0 0 5px rgba(255,196,0,.7)}
.blk.done{background:#e3f5e7;border-color:var(--good)}
#pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;flex:1;min-height:0}
#pad button{border:0;border-radius:18px;background:#fff;box-shadow:0 5px 0 var(--edge);font-size:38px;cursor:pointer;min-height:56px}
#pad button:active{transform:translateY(4px);box-shadow:0 1px 0 var(--edge)}
#pad .zero{grid-column:span 2}
#pad .hint{background:#fff6cc;font-size:34px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
#pad .hint small{font-size:14px;margin-top:2px}
#right.nopad{width:170px}
#right.nopad #pad{grid-template-columns:1fr}
#right.nopad #pad button:not(.hint){display:none}
#right.nopad #pad{flex:none;height:150px}
#right.nopad #mini{grid-template-columns:1fr 1fr;margin-top:auto}
#bPad.on{background:#fff6cc}
#pad .hint.hl{animation:pulse 1s ease-in-out infinite;background:#ffe27a}
#mini{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.mini{text-decoration:none;color:inherit;min-height:54px;border:0;border-radius:14px;background:#fff;box-shadow:0 4px 0 var(--edge);font-size:13px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.25;padding:2px}
.mini:active{transform:translateY(3px);box-shadow:0 1px 0 var(--edge)}
.mini.hl{background:#fff1b8;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
.mini small{font-size:11px;opacity:.6}
.mini.holdable{background-image:linear-gradient(#ffcf70,#ffcf70);background-repeat:no-repeat;background-size:0 100%}
.mini.hold{background-size:100% 100%;transition:background-size .9s linear}
#overlay{position:fixed;inset:0;background:rgba(40,35,25,.55);display:none;align-items:center;justify-content:center;padding:12px;z-index:5}
#overlay.on{display:flex}
.card{background:var(--card);border-radius:24px;padding:18px 22px;width:min(600px,100%);max-height:100%;overflow:auto;text-align:center;box-shadow:0 8px 0 rgba(0,0,0,.18)}
.card h1{margin:0 0 8px;font-size:32px}.card h2{margin:0 0 8px;font-size:28px}
.lvs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.lock{margin:6px 0 12px;padding:12px;border-radius:14px;background:#ececf0;color:#7a7a88;font-size:17px}
.hws{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 0 10px}
.icons{display:flex;justify-content:flex-end;gap:10px;margin-top:14px}
.ic{width:56px;height:56px;border-radius:50%;background:#fff;border:3px solid #dccfae;box-shadow:0 3px 0 #dccfae;display:flex;align-items:center;justify-content:center;font-size:26px;text-decoration:none;padding:0;cursor:pointer}
.lv.prac{width:100%;margin-top:10px;font-size:26px;padding:16px 0}
.lv.prac.hl{background:#ffe27a;border-color:#e0a100;font-weight:700}
.lv.prac.gray{background:#ececf0;border-color:#c9c9d6;color:#9a9aa8}
.lv.hw{background:#ffe27a;border-color:#e0a100}
.lv.hw.done{background:#ececf0;border-color:#c9c9d6;color:#9a9aa8;cursor:default}
.lv.hw .stars{color:#7a4f00;font-size:17px}
.lv.hw.done .stars{color:#9a9aa8;font-size:17px}
.lv{border:3px solid var(--edge);border-radius:18px;background:#fff;padding:10px 8px;cursor:pointer;font-size:19px;line-height:1.3}
.sec{font-size:22px;margin:14px 0 6px;text-align:left;padding-left:4px}
.lv small{display:block;font-size:14px;opacity:.65}
.lv .stars{font-size:20px;color:#ffb400;min-height:26px}
.lv:active{transform:translateY(3px)}
.lv.rec{border-color:var(--good);background:#e8f7ec}
.go{width:100%;min-height:60px;margin-top:8px;border:0;border-radius:18px;background:var(--good);color:#fff;font-size:24px;box-shadow:0 5px 0 #20703a;cursor:pointer;display:block;text-align:center;text-decoration:none;line-height:60px;padding:0}
.go.alt{background:#fff;color:var(--ink);box-shadow:0 5px 0 var(--edge);font-size:20px;min-height:52px;line-height:52px;margin-top:10px}
.links{display:flex;gap:8px}.links .go{margin-top:10px}
.big{font-size:60px;line-height:1.1}
.bigstars{font-size:60px;color:#ffb400;letter-spacing:6px}
.sub{font-size:16px;opacity:.75;margin:4px 0}
@media (orientation:portrait){
  #app{flex-direction:column;gap:8px}
  #right{width:100%;flex:none;height:min(48%,430px)}
  #scene{height:150px} #mon{width:124px;height:124px}
  .vf{--cs:min(100px,26vw)} .eq{font-size:46px}
  #right.nopad{width:100%;height:auto;flex-direction:row;flex-wrap:wrap}
  #right.nopad #pad{flex:1;min-width:120px;height:auto}
  #right.nopad #mini{grid-template-columns:repeat(4,1fr);flex:3;margin-top:0}
  #hpwrap{width:180px}
  #prob{padding-top:76px}
  .vf{--cs:min(100px,24vw,var(--csh,999px))}
  .vf .cc{height:calc(var(--cs)*.75)} .cc .cell.carry{height:calc(var(--cs)*.7)}
  .pt{width:80px;height:64px;font-size:28px}
  .sz{width:34px;height:34px}
}
@media (max-height:520px) and (orientation:landscape){.eq{font-size:46px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
#bSound,#bParent{display:none!important}
</style>
</head>
<body>
<div id="app">
  <div id="left">
    <div id="head">
      <div class="box chip2" id="lvName"></div>
      <div class="box chip2" id="rec"></div>
    </div>
    <div id="scene" class="box">
      <div id="mon"></div>
      <div id="hpwrap"><div class="lbl" id="hpl">진화</div><div id="hp"><i id="hpf" style="width:0%"></i></div><div id="dragons"></div></div>
      <div id="streak"></div>
    </div>
    <div id="probwrap" class="box"><div id="prob"></div><canvas id="ans"></canvas><canvas id="pen"></canvas>
      <div id="pentools">
        <button class="pt on" data-t="pen" aria-label="펜">✏️<span>펜</span></button>
        <button class="pt" data-t="erase" aria-label="지우개">🧽<span>지우개</span></button>
        <div id="szrow"></div>
      </div></div>
  </div>
  <div id="right">
    <div id="pad"></div>
    <div id="mini">
      <a class="mini" href="../">🏠<span>처음</span></a>
      <button class="mini" id="bMenu">☰<span>메뉴</span></button>
      <button class="mini" id="bPad">⌨<span>숫자판</span></button>
      <button class="mini" id="bSound">🔊<span>소리</span></button>
      <button class="mini holdable" id="bParent">👪<span>부모님</span><small>꾹 누르기</small></button>
    </div>
  </div>
</div>
<div id="overlay"></div>
<script src="../algakki/guard.js"></script>
<script>
(function(){
const $=id=>document.getElementById(id);
const LS=Guard.LS, rand=n=>Math.floor(Math.random()*n);
const LV={1:{n:'올림 없는 곱셈',ex:'21 × 4'},2:{n:'올림 한 번',ex:'14 × 6'},3:{n:'100 넘는 곱셈',ex:'47 × 6'},4:{n:'섞어서 도전',ex:'여러 가지'}};
let level=4, qs=[], cur=null, input='', phase='menu', R=null, mood='idle', msgT='', msgC='', muted=false, overlayMode='';
const TOTAL=20;
const CIR='①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳㉑㉒㉓㉔';
/* 숙제 학습지: 1회→3회로 갈수록 어려움(올림·백의 자리 문제 비율 기준). 각 회차 안은 종이 번호순 */
const HW={
 1:[[14,6],[36,3],[17,9],[28,2],[27,4],[38,2],[17,8],[17,2],[18,5],[15,4],[35,2],[19,3],[19,2],[13,9],[17,7],[14,5],[28,3],[16,3],[27,3],[45,2],[13,6],[26,4],[15,7],[14,4]],
 2:[[18,3],[47,2],[12,5],[14,6],[14,5],[19,9],[48,2],[18,6],[25,4],[18,2],[15,4],[17,7],[15,9],[12,9],[35,2],[16,4],[12,6],[18,9],[24,4],[29,4],[39,2],[12,8],[29,3],[45,2]],
 3:[[26,4],[15,9],[27,4],[17,6],[35,3],[14,7],[19,2],[29,3],[16,8],[12,5],[15,2],[17,7],[26,3],[17,4],[15,6],[15,4],[12,9],[18,8],[49,2],[15,7],[12,6],[15,3],[34,3],[16,6]]
};

/* ---------- sound ---------- */
let AC;
function unlock(){ try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume(); }catch(e){} }
function tone(f0,f1,d,type,v,delay){
  if(muted) return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const t0=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();
    o.type=type||'sine'; o.frequency.setValueAtTime(f0,t0); if(f1!==f0) o.frequency.exponentialRampToValueAtTime(f1,t0+d);
    g.gain.setValueAtTime(v||.08,t0); g.gain.exponentialRampToValueAtTime(.0001,t0+d);
    o.connect(g); g.connect(AC.destination); o.start(t0); o.stop(t0+d);
  }catch(e){}
}
const sfx={
  key:()=>tone(620,620,.04,'triangle',.04),
  step:()=>{tone(600,600,.1,'triangle');tone(800,800,.12,'triangle',.08,.09)},
  ok:()=>{tone(660,660,.12,'triangle',.09);tone(880,880,.18,'triangle',.09,.1);tone(1175,1175,.22,'triangle',.08,.2)},
  hit:()=>tone(260,90,.25,'square',.06),
  no:()=>tone(230,170,.22,'sawtooth',.045),
  win:()=>[523,659,784,1046,1318].forEach((f,i)=>tone(f,f,.22,'triangle',.09,i*.13))
};

/* ---------- stats ---------- */
const SCK='score.mult';
const getStats=()=>LS.get(SCK,null)||{r:0,w:0};
const bump=k=>{ const s=getStats(); s[k]++; LS.set(SCK,s); };
const getStars=()=>LS.get('mult.stars',null)||{};
function renderHead(){
  const s=getStats();
  $('lvName').textContent=(R&&R.hw)?'📒 숙제 '+R.hw+'회 · '+(cur&&cur.n?CIR[cur.n-1]+'번':'연습 문제'):'✏️ 연습문제';
  $('rec').textContent='🏆 정답 '+s.r+' : 오답 '+s.w;
}

/* ---------- questions ---------- */
function genQ(lv){
  for(;;){
    const L=lv===4?1+rand(3):lv;
    const b=2+rand(8),t=1+rand(9),o=1+rand(9),a=t*10+o,oneP=o*b,carry=Math.floor(oneP/10),tensSum=t*b+carry;
    const ok=L===1?(oneP<10&&t*b<10):L===2?(oneP>=10&&tensSum<10):tensSum>=10;
    if(ok) return {a,b,t,o,ans:a*b,app:0};
  }
}
function genRound(lv){
  const seen=new Set(),out=[];
  while(out.length<TOTAL){ const q=genQ(lv),k=q.a+'x'+q.b; if(seen.has(k)) continue; seen.add(k); out.push(q); }
  return out;
}

/* ---------- monster ---------- */
const PAL={1:{a:'#8ee59a',b:'#38a84d',bel:'#eaffd8',w:'#2f8f46'},2:{a:'#9ccdff',b:'#3d82de',bel:'#e6f3ff',w:'#2a62b5'},3:{a:'#ffc888',b:'#ee7226',bel:'#fff0d4',w:'#c24d16'},4:{a:'#dcb6ff',b:'#9258dc',bel:'#f5e8ff',w:'#6a34ad'}};
const CIDX=k=>({1:1,2:2,3:3,4:4}[k]||1);
/* 0~23단계: 알 → 금 → 깨어남 → 팔다리/꼬리/뿔 → 날개 → 용 */
function monsterSVG(ci,m,st){
  ci=CIDX(ci); st=Math.max(0,Math.min(23,Math.round(st||0)));
  const P=PAL[ci],K='#2a2a33',t=(a,b)=>Math.max(0,Math.min(1,(st-a)/(b-a))),f=n=>(+n).toFixed(1);
  const gid='g'+ci,eid='e'+ci;
  const defs='<defs><radialGradient id="'+gid+'" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="'+P.a+'"/><stop offset="1" stop-color="'+P.b+'"/></radialGradient>'
    +'<radialGradient id="'+eid+'" cx="38%" cy="30%" r="85%"><stop offset="0" stop-color="#fffdf0"/><stop offset="1" stop-color="'+P.a+'"/></radialGradient></defs>';
  const shadow='<ellipse cx="100" cy="168" rx="'+f(40+30*t(0,10))+'" ry="8" fill="rgba(0,0,0,.18)"/>';
  const spots='<g fill="'+P.b+'" opacity=".55"><circle cx="76" cy="104" r="8"/><circle cx="124" cy="118" r="10"/><circle cx="90" cy="144" r="7"/><circle cx="126" cy="148" r="6"/><circle cx="68" cy="132" r="5"/><circle cx="110" cy="84" r="5"/></g>';

function info(q){ const oneP=q.o*q.b,c=Math.floor(oneP/10),ts=q.t*q.b+c; return {oneP,c,ts}; }
const sig=q=>{ const {c,ts}=info(q); return (c>0?'c':'')+(ts>=10?'h':''); };
function similar(q){
  const s=sig(q);

    const b=n<250?q.b:2+rand(8),t=1+rand(9),o=1+rand(9),a=t*10+o,k=a+'x'+b;

}

/* ---------- flow ---------- */
function startRound(lv){
  level=4;
  qs=genRound(lv); R={cleared:0,first:0,streak:0,best:0,total:TOTAL,missed:[],seen:new Set(qs.map(q=>q.a+'x'+q.b))};

}
function startHw(s){
  { const d=LS.get('mult.hwdone',null)||{}; if(s!==[1,2,3].find(k=>!d[k])) return; }
  const sv=LS.get('mult.hwprog',null);
  if(sv&&sv.hw===s&&Array.isArray(sv.qs)&&sv.qs.length){
    qs=sv.qs.map(q=>({...q}));
    R={hw:s,cleared:sv.cleared||0,first:sv.first||0,streak:0,best:sv.best||0,total:sv.total||24,missed:sv.missed||[],seen:new Set(sv.seen||[])};
  }else{
    qs=HW[s].map(([a,b],i)=>({a,b,t:Math.floor(a/10),o:a%10,ans:a*b,app:0,n:i+1}));
    R={hw:s,cleared:0,first:0,streak:0,best:0,total:qs.length,missed:[],seen:new Set(qs.map(q=>q.a+'x'+q.b))};
  }
  closeOverlay(); phase='ask'; renderDragons(); setMood('idle'); nextQ();
}
function saveHw(){
  if(!R||!R.hw) return;
  const q=x=>({a:x.a,b:x.b,t:x.t,o:x.o,ans:x.ans,app:x.app,n:x.n});
  const arr=[{...q(cur),app:Math.max(0,cur.app-1)},...qs.map(q)];
  LS.set('mult.hwprog',{hw:R.hw,qs:arr,cleared:R.cleared,first:R.first,best:R.best,total:R.total,missed:R.missed,seen:[...R.seen]});
}
function nextQ(){
  if(!qs.length){ endRound(); return; }
  cur=qs.shift(); cur.app++; cur.cells=buildCells(cur); cur.vals={}; cur.res={}; cur.sel=null; cur.wrong=0; cur.hinted=false; cur.flash=false; cur.wa={};
  saveHw();
  phase='ask'; clearPen(); say(cur.app>=2?'다시 도전! 아까와 비슷한 문제예요 💪':'',''); render();
}
function hint(){
  if(phase!=='ask'||!cur) return;
  const k=selKey(); if(!k) return;
  cur.hinted=true; say(hintText(k),'hint'); render();
}
function enter(d){ const k=selKey(); if(k) enterAt(k,d,false); }
function enterAt(k,d){
  if(!unfilled(k)) return;
  cur.vals[k]=d; delete cur.res[k]; cur.sel=null;
  if(cur.cells.some(c=>cur.vals[c.k]===undefined)){ say('',''); render(); return; }
  let bad=0;
  for(const c of cur.cells){
    if(cur.res[c.k]) continue;
    if(cur.vals[c.k]===c.ans) cur.res[c.k]='ok';
    else{ cur.res[c.k]='bad'; bad++; cur.wrong++; cur.wa[c.k]=(cur.wa[c.k]||0)+1; bump('w'); }
  }
  if(!bad){ solved(); return; }
  R.streak=0; sfx.no(); setMood('laugh',600);
  const hc=cur.cells.find(c=>cur.res[c.k]==='bad'&&cur.wa[c.k]>=2);
  if(hc){ cur.hinted=true; say('같이 계산해 봐요! '+hintText(hc.k),'hint'); } else say('','');
  cur.flash=true; render();
  const q=cur; setTimeout(()=>{ if(cur===q){ q.flash=false; render(); } },450);
}
function solved(){
  const helped=cur.wrong>0||cur.hinted;
  phase='fb'; bump('r');
  let clear=false;
  if(!helped){ clear=true; if(cur.app===1) R.first++; R.streak++; R.best=Math.max(R.best,R.streak); }
  else if(cur.app>=2) clear=true;
  if(clear){
    R.cleared++; sfx.ok(); evolveFx();
    say(!helped?'정답! 🎉 '+(R.streak>=3?R.streak+'연속!':'멋져요'):'잘했어요! 👏','ok');
  }else{
    if(cur.n&&cur.app===1&&!R.missed.includes(cur.n)) R.missed.push(cur.n);
    sfx.step(); say('잘했어요! 비슷한 문제가 한 번 더 나와요 😉','ok');
    qs.push(similar(cur));
  }
  render();
  const id=R;
  setTimeout(()=>{ if(R===id&&phase==='fb') nextQ(); },clear?1200:1600);
}
function flyShow(ci,done){
  const W=innerWidth,H=innerHeight,L=document.createElement('div');
  L.id='fly'; const D=Math.min(200,Math.max(130,W*.42));
  L.innerHTML='<div class="fd" style="width:'+D+'px;height:'+D*.9+'px">'+monsterSVG(ci,'idle',23)+'</div>';
  document.body.appendChild(L);
  const fd=L.firstChild; let t0=performance.now(),last=0,fin=false,dirP=1;
  const end=()=>{ if(fin) return; fin=true; L.style.opacity='0'; setTimeout(()=>{ L.remove(); done(); },350); };
  L.addEventListener('pointerdown',end);
  const DUR=5200;
  (function loop(now){
    if(fin) return;
    const t=(now-t0)/1000;
    if(now-t0>DUR){ end(); return; }
    const sw=(W-D)/2, x=W/2-D/2+Math.sin(t*1.25-1.57)*sw*Math.min(1,t/0.9+.15), y=H*.30+Math.sin(t*2.6)*H*.05+Math.cos(t*1.25)*0;
    const dir=Math.cos(t*1.25-1.57)>=0?1:-1;           // 1: 오른쪽으로 이동
    fd.style.transform='translate('+x.toFixed(1)+'px,'+y.toFixed(1)+'px) scaleX('+(-dir)+') rotate('+(dir*-6+Math.sin(t*5)*3).toFixed(1)+'deg)';
    if(now-last>70&&t>.3){
      last=now;
      const f=document.createElement('span'); f.className='ff'; f.textContent=Math.random()<.2?'✨':'🔥';
      const sz=34+Math.random()*34; f.style.fontSize=sz+'px';
      const mx=x+D/2+dir*D*.34, my=y+D*.55;
      f.style.left=mx+'px'; f.style.top=my+'px';
      f.style.setProperty('--dx',(dir*(140+Math.random()*170))+'px'); f.style.setProperty('--dy',((Math.random()-.3)*90)+'px'); f.style.setProperty('--r',((Math.random()-.5)*80)+'deg');
      L.appendChild(f); setTimeout(()=>f.remove(),900);
    }
    requestAnimationFrame(loop);
  })(performance.now());
}
function endRound(){
  phase='end'; cur=null; render();
  setMood('win'); renderDragons();
  const fr=R.first/R.total,stars=fr>=.9?3:fr>=.7?2:fr>=.4?1:0,sk=R.hw?'hw'+R.hw:level;
  const all=getStars(); if(stars>(all[sk]||0)){ all[sk]=stars; LS.set('mult.stars',all); }
  if(R.hw){ const d=LS.get('mult.hwdone',null)||{}; d[R.hw]=true; LS.set('mult.hwdone',d); LS.set('mult.hwprog',null); }
  setTimeout(()=>{ sfx.win(); flyShow(R.hw?R.hw:level,()=>{ burst(14); showEnd(stars); }); },900);
}

    +(R.hw?'':'<button class="go" data-act="again">한 번 더</button>')
    +'<button class="go'+(R.hw?'':' alt')+'" data-act="menu">메뉴로</button>','end');

$('overlay').addEventListener('click',e=>{
  unlock();

/* ---------- input ---------- */
function press(k){
  if(phase!=='ask'||overlayMode) return;
  if(k==='💡'){ hint(); return; }
  if(/^\d$/.test(k)){ sfx.key(); resetAns(); enter(+k); }
}
$('pad').addEventListener('pointerdown',e=>{ unlock(); const b=e.target.closest('button'); if(b){ e.preventDefault(); press(b.dataset.k); } });
document.addEventListener('keydown',e=>{ if(/^[0-9]$/.test(e.key)) press(e.key); });
$('bMenu').addEventListener('click',showMenu);

let holdT=null; const bP=$('bParent');
bP.addEventListener('pointerdown',()=>{ bP.classList.add('hold'); holdT=setTimeout(()=>{ holdT=null; bP.classList.remove('hold'); Guard.parentFlow(); },900); });
['pointerup','pointerleave','pointercancel'].forEach(ev=>bP.addEventListener(ev,()=>{ clearTimeout(holdT); bP.classList.remove('hold'); }));
function vh(){ document.documentElement.style.setProperty('--vh',(window.innerHeight/100)+'px'); }
window.addEventListener('resize',vh); vh();

/* ---------- 연습장 + 칸에 직접 쓰기 ---------- */
const pen=$('pen'),pctx=pen.getContext('2d'),anv=$('ans'),actx=anv.getContext('2d');
const PEN=[3,5,8,12,18],ERA=[16,28,44,64,88];
let penSz=Math.max(1,Math.min(5,+LS.get('mult.pensz',2)||2)),eraSz=Math.max(1,Math.min(5,+LS.get('mult.erasz',3)||3));
const ink='#2b2b35';let erase=false,pdraw=null,zones={},ansS={};
function fitCs(){
  const root=document.documentElement,w=$('probwrap');
  if(!matchMedia('(orientation:portrait)').matches||!w){ root.style.removeProperty('--csh'); return; }
  const H=w.clientHeight; if(!H) return;
  root.style.setProperty('--csh',Math.max(50,(H-76-24)/3.75).toFixed(1)+'px');
}
function sizePen(){
  fitCs();
  const dpr=Math.min(window.devicePixelRatio||1,2),w=pen.clientWidth,h=pen.clientHeight;
  if(!w||!h) return;
  const W=Math.round(w*dpr),H=Math.round(h*dpr);
  for(const [c,x] of [[pen,pctx],[anv,actx]]){
    if(c.width!==W||c.height!==H){ c.width=W; c.height=H; }
    x.setTransform(dpr,0,0,dpr,0,0); x.lineCap='round'; x.lineJoin='round';
  }
  redrawAns();
}
function wipe(c,x){ x.save(); x.setTransform(1,0,0,1,0,0); x.clearRect(0,0,c.width,c.height); x.restore(); }
function clearPen(){ wipe(pen,pctx); resetAns(); }
function resetAns(){ for(const k in ansS) clearTimeout(ansS[k].t); ansS={}; wipe(anv,actx); }
function redrawAns(){ wipe(anv,actx); for(const k in ansS) for(const s of ansS[k].strokes) for(let i=0;i<s.length;i++) stroke(actx,s[Math.max(0,i-1)],s[i],s.col); }
const pp=e=>{ const r=pen.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top}; };
function stroke(x,a,b,col){
  const er=(x===pctx&&erase);
  x.globalCompositeOperation=er?'destination-out':'source-over';
  x.strokeStyle=col||ink; x.lineWidth=er?ERA[eraSz-1]:(5);
  x.beginPath(); x.moveTo(a.x,a.y); x.lineTo(b.x,b.y); x.stroke();
}
/* 인식 영역: 보이는 칸보다 사방으로 50% 넓게. 겹치는 곳은 가장 가까운 칸으로 */
function layoutAct(){
  zones={}; if(phase!=='ask'||!cur) return;
  const o=pen.getBoundingClientRect();
  for(const k of ['o','t','h']){
    const el=$('prob').querySelector('.cell[data-k="'+k+'"]'); if(!el) continue;
    const r=el.getBoundingClientRect();
    zones[k]={x:r.left-o.left,y:r.top-o.top,w:r.width,h:r.height,m:r.width*0.5};
  }
}
function zoneAt(p){
  let best=null,bd=1e9;
  for(const k in zones){
    if(cur.res[k]==='ok') continue;
    const z=zones[k];
    if(p.x<z.x-z.m||p.x>z.x+z.w+z.m||p.y<z.y-z.m||p.y>z.y+z.h+z.m) continue;
    const d=Math.hypot(p.x-(z.x+z.w/2),p.y-(z.y+z.h/2)); if(d<bd){ bd=d; best=k; }
  }
  return best;
}
function eraseCells(q){
  if(!erase||phase!=='ask'||!cur) return;
  const r=ERA[eraSz-1]/2; let hit=false;
  for(const k in zones){
    if(cur.vals[k]===undefined) continue;
    const z=zones[k];
    if(q.x<z.x-r||q.x>z.x+z.w+r||q.y<z.y-r||q.y>z.y+z.h+r) continue;
    delete cur.vals[k]; delete cur.res[k]; hit=true;
  }
  if(hit){ cur.sel=null; say('',''); render(); }
}
function markSel(){ const a=padOn?selKey():null; document.querySelectorAll('#prob .cell.act').forEach(e=>e.classList.remove('act')); if(a){ const e=$('prob').querySelector('.cell[data-k="'+a+'"]'); if(e) e.classList.add('act'); } }

/* 손글씨 숫자 인식 (기기 안에서 실행, 서버 전송 없음) */
let MODEL=null;
fetch('digits.json').then(r=>r.json()).then(m=>{
  const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  const W1=new Int8Array(b(m.w1).buffer),W2=new Int8Array(b(m.w2).buffer);
  MODEL={h:m.h,W1,W2,s1:m.s1,s2:m.s2,b1:m.b1,b2:m.b2};
}).catch(()=>{ MODEL=null; padOn=true; applyPad(); });
function classify(x){
  const {h,W1,W2,s1,s2,b1,b2}=MODEL,hid=new Float32Array(h);
  for(let j=0;j<h;j++) hid[j]=b1[j];
  for(let i=0;i<784;i++){ const v=x[i]; if(v>0.01){ const o=i*h; for(let j=0;j<h;j++) hid[j]+=v*W1[o+j]*s1; } }
  const out=new Float32Array(10);
  for(let k=0;k<10;k++) out[k]=b2[k];
  for(let j=0;j<h;j++){ const v=hid[j]; if(v>0){ const o=j*10; for(let k=0;k<10;k++) out[k]+=v*W2[o+k]*s2; } }
  let mx=-1e9; for(const v of out) if(v>mx) mx=v;
  let s=0; const pr=Array.from(out,v=>{ const e=Math.exp(v-mx); s+=e; return e; });
  return pr.map(v=>v/s);
}
function rasterDigit(strokes,bb,dx,dy){
  const side=Math.max(bb.w,bb.h,1),sc=20/side,cv=document.createElement('canvas'); cv.width=cv.height=28;
  const g=cv.getContext('2d'); g.lineCap='round'; g.lineJoin='round'; g.strokeStyle='#fff'; g.lineWidth=2.4; g.fillStyle='#fff';
  const tx=p=>(p.x-(bb.x+bb.w/2))*sc+14+dx, ty=p=>(p.y-(bb.y+bb.h/2))*sc+14+dy;
  for(const s of strokes){
    if(s.length===1){ g.beginPath(); g.arc(tx(s[0]),ty(s[0]),1.3,0,7); g.fill(); continue; }
    g.beginPath(); g.moveTo(tx(s[0]),ty(s[0])); for(let i=1;i<s.length;i++) g.lineTo(tx(s[i]),ty(s[i])); g.stroke();
  }
  const d=g.getImageData(0,0,28,28).data,a=new Float32Array(784);
  for(let i=0;i<784;i++) a[i]=d[i*4+3]/255;
  return a;
}
function readDigit(strokes){
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const s of strokes) for(const q of s){ x0=Math.min(x0,q.x); y0=Math.min(y0,q.y); x1=Math.max(x1,q.x); y1=Math.max(y1,q.y); }
  const bb={x:x0,y:y0,w:x1-x0,h:y1-y0};
  if(Math.max(bb.w,bb.h)<14) return null;
  let a=rasterDigit(strokes,bb,0,0),m=0,cx=0,cy=0;
  for(let i=0;i<784;i++){ m+=a[i]; cx+=a[i]*(i%28); cy+=a[i]*Math.floor(i/28); }
  if(m>0) a=rasterDigit(strokes,bb,14-cx/m,14-cy/m);
  const pr=classify(a); let top=0; for(let k=1;k<10;k++) if(pr[k]>pr[top]) top=k;
  return {top,p:pr};
}
function recognizeAns(k){
  const a=ansS[k]; if(!a) return;
  const strokes=a.strokes; delete ansS[k]; redrawAns();
  if(phase!=='ask'||!cur||!MODEL||cur.res[k]==='ok') return;
  const cell=cur.cells.find(c=>c.k===k);
  if(!cell){ say('이 문제에서는 '+LAB[k]+'의 자리 칸이 필요 없어요. 비워 두세요 🙂','no'); render(); return; }
  const r=readDigit(strokes);
  if(!r){ say('숫자를 크게 써 줄래요? ✏️','no'); render(); return; }
  const want=cell.ans; let d=r.top;
  if(d!==want&&r.p[want]>=0.2) d=want;
  if(d!==want&&r.p[r.top]<0.5){ say('숫자를 잘 못 읽었어요. 한 번 더 또박또박 써 줄래요? ✏️','no'); render(); return; }
  sfx.key(); enterAt(k,d);
}
pen.addEventListener('pointerdown',e=>{
  unlock(); sizePen(); try{pen.setPointerCapture(e.pointerId);}catch(_){}
  const q=pp(e),k=(!erase&&MODEL&&phase==='ask')?zoneAt(q):null;
  if(k){
    cur.sel=k; markSel();
    const a=ansS[k]||(ansS[k]={strokes:[],t:null}); clearTimeout(a.t);
    const s=[q]; s.col=ink; a.strokes.push(s); pdraw={p:q,k,s}; stroke(actx,q,q,ink);
  }else{ pdraw={p:q,k:null}; stroke(pctx,q,q); eraseCells(q); }
});
pen.addEventListener('pointermove',e=>{
  if(!pdraw) return; const q=pp(e);
  if(pdraw.k){ pdraw.s.push(q); stroke(actx,pdraw.p,q,pdraw.s.col); } else{ stroke(pctx,pdraw.p,q); eraseCells(q); }
  pdraw.p=q;
});
['pointerup','pointercancel'].forEach(ev=>pen.addEventListener(ev,()=>{
  if(pdraw&&pdraw.k){ const k=pdraw.k,a=ansS[k]; if(a){ clearTimeout(a.t); a.t=setTimeout(()=>recognizeAns(k),850); } }
  pdraw=null;
}));
$('pentools').addEventListener('click',e=>{
  const b=e.target.closest('.pt'); if(!b) return;
  const t=b.dataset.t;
  erase=(t==='erase');
  document.querySelectorAll('#pentools .pt').forEach(x=>x.classList.toggle('on',x===b));
  renderSz();
});
function renderSz(){
  $('szrow').style.visibility=erase?'visible':'hidden'; const cur=eraSz; let h='';
  for(let i=1;i<=5;i++){ const d=erase?8+i*4:4+i*2.6; h+='<button class="sz'+(i===cur?' on':'')+'" data-s="'+i+'" aria-label="크기 '+i+'"><i style="width:'+d.toFixed(1)+'px;height:'+d.toFixed(1)+'px'+(erase?';background:#f0a8b8;border:2px solid #b86b80;box-sizing:border-box':'')+'"></i></button>'; }
  $('szrow').innerHTML=h;
}
$('szrow').addEventListener('click',e=>{
  const b=e.target.closest('.sz'); if(!b) return; const n=+b.dataset.s;
  if(!erase) return; eraSz=n; LS.set('mult.erasz',n);
  renderSz();
});
renderSz();
window.addEventListener('resize',()=>setTimeout(()=>{ sizePen(); layoutAct(); },150));

/* 숫자판 보이기/숨기기 */
let padOn=LS.get('mult.pad',false);
function applyPad(){ $('right').classList.toggle('nopad',!padOn); $('bPad').classList.toggle('on',padOn); setTimeout(()=>{ sizePen(); layoutAct(); },50); }
$('bPad').addEventListener('click',()=>{ padOn=!padOn; LS.set('mult.pad',padOn); applyPad(); });

/* boot */
renderPad(); renderHead(); renderDragons(); setMood('idle'); sizePen(); applyPad(); showMenu();
Guard.start({free:true,noLimit:true,onReset:renderHead});
window.__mult={monsterSVG,readDigit,sig,startRound,get cur(){return cur;},get R(){return R;},get phase(){return phase;},get qs(){return qs;},genQ};
})();
