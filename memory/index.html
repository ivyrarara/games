<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Matching Pairs</title>
<meta name="theme-color" content="#14142b">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
:root{--ink:#111;--font:"Jua","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;--vh:1vh;--good:#2f8f4e;--edge:#dccfae}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:#14142b;color:#fff;font-family:var(--font);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;color-scheme:dark}
button,a{font-family:inherit;color:inherit}
#app{height:calc(var(--vh)*100);display:flex;gap:12px;padding:10px}
#board{flex:1;min-width:0;position:relative;background:#000;border-radius:26px;border:4px solid #2b2b55}
.c{position:absolute;perspective:700px;cursor:pointer}
.in{position:absolute;inset:0;transition:transform .35s;transform-style:preserve-3d}
.c.up .in,.c.done .in{transform:rotateY(180deg)}
.f,.bk{position:absolute;inset:0;border-radius:14%/11%;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;border:3px solid #111}
.f{transform:rotateY(180deg)}
.f svg{position:absolute;left:0;top:3%;width:100%;height:100%}
.bk{background:#ff8cc6;display:flex;align-items:center;justify-content:center}
.bk svg{width:70%;height:70%}
.c.done{pointer-events:none}.c.done .f{opacity:.4;transition:opacity .5s .3s}
.c.hint .f{box-shadow:0 0 0 4px #ffe14d inset}
#panel{width:250px;display:flex;flex-direction:column;gap:10px;flex:none}
.box{background:#22224a;border-radius:18px;padding:12px 14px;border:3px solid #3a3a72}
#status{font-size:22px;line-height:1.25;min-height:80px}
#status small{display:block;font-size:14px;opacity:.7;margin-top:4px}
#status.me{background:#fff2b8;border-color:#ffd23f;color:#111}
#status.ok{background:#d7f5dc;border-color:#2f8f4e;color:#111}
#score{font-size:19px;text-align:center}
.time{font-size:16px;padding:8px 14px;text-align:center}.time.low{background:#6b4b00}
.info{display:flex;flex-direction:column;gap:10px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{min-height:54px;border:0;border-radius:16px;background:#fff;color:#111;box-shadow:0 4px 0 #9a9ac0;font-size:18px;cursor:pointer;padding:6px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #9a9ac0}
.btn small{font-size:12px;opacity:.6}
.btn.holdable{background-image:linear-gradient(#ffcf70,#ffcf70);background-repeat:no-repeat;background-size:0 100%}
.btn.hold{background-size:100% 100%;transition:background-size .9s linear}
#overlay{position:fixed;inset:0;background:rgba(10,10,30,.7);display:none;align-items:center;justify-content:center;padding:12px;z-index:5}
#overlay.on{display:flex}
.pop{background:#fffdf6;color:#2a2a33;border-radius:24px;padding:16px 22px;width:min(560px,100%);max-height:100%;overflow:auto;text-align:center;box-shadow:0 8px 0 rgba(0,0,0,.3)}
.pop h1{margin:0 0 4px;font-size:34px}.pop h2{margin:0 0 8px;font-size:28px}
.sub{font-size:15px;opacity:.7;margin:0 0 6px}
.row{margin:8px 0}.row>b{display:inline-block;font-size:17px;margin-bottom:4px;font-weight:400;opacity:.75}.row small{font-size:13px;opacity:.6}
.go{width:100%;min-height:60px;margin-top:8px;border:0;border-radius:18px;background:var(--good);color:#fff;font-size:26px;box-shadow:0 5px 0 #20703a;cursor:pointer;display:block;text-align:center;text-decoration:none;line-height:60px;padding:0}
.go:active{transform:translateY(4px);box-shadow:0 1px 0 #20703a}
.go.alt{background:#fff;color:#2a2a33;box-shadow:0 5px 0 var(--edge);font-size:20px;min-height:52px;line-height:52px}
.links{display:flex;gap:8px;flex-wrap:wrap}.links .go{margin-top:8px;flex:1 1 28%;min-width:90px;line-height:1.2;min-height:48px;padding:10px 6px;display:flex;align-items:center;justify-content:center}
.big{font-size:56px;line-height:1.1}
.lvbar{display:flex;align-items:center;gap:12px;margin:10px 4px 4px;font-size:17px}.lvbar span{white-space:nowrap}
#lvtrack{position:relative;flex:1;height:52px;margin:0 22px;touch-action:none;cursor:pointer}
#lvtrack::before{content:'';position:absolute;left:0;right:0;top:50%;height:8px;margin-top:-4px;border-radius:4px;background:#e4ddc9}
#lvtrack .dt{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:#fff;border:3px solid #cbbf9f}
#lvtrack .dt.on{border-color:#2d8f4e;background:#bfe8cc}
#lvthumb{position:absolute;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:#fff;border:4px solid #2d8f4e;box-shadow:0 3px 0 rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;font-size:24px;transition:left .08s}
@media (orientation:portrait){
  #app{flex-direction:column;gap:8px}
  #panel{width:100%;flex-direction:row;flex-wrap:wrap}
  #panel>.box{flex:1 1 45%}#status{min-height:60px;font-size:19px;flex-basis:100%}
  .btns{flex-basis:100%;grid-template-columns:repeat(4,1fr)}
}
#elapsed{text-align:center;background:#ffe27a!important;color:#2a2a33;border-color:#e9b400!important;font-variant-numeric:tabular-nums;letter-spacing:.02em}
#etime{font-size:calc(var(--vh)*7);line-height:1.1}
#estat{font-size:calc(var(--vh)*2.8);letter-spacing:0;margin-top:4px;line-height:1.25}
#estat small{display:block;font-size:.8em;opacity:.7}
#elapsed.ok{background:#bff0c8!important;border-color:#5cbd75!important}
.hide-x{}
#bAgain,#bSound,#bParent{display:none!important}
.btns{grid-template-columns:1fr 1fr!important}.btn.wide{grid-column:auto!important}

.btn{text-decoration:none}
.info{display:flex!important;flex-direction:column!important;gap:2px;flex-basis:100%;justify-content:flex-end}.info>.box{flex:none!important;min-width:0;font-size:15px;padding:0 4px!important;text-align:left;background:none!important}.info>.box.time.low{color:#ffd23f}
.box{background:rgba(255,255,255,.08)!important;border:0!important;box-shadow:none!important}
</style>
</head>
<body>
<div id="app">
  <div id="board"></div>
  <aside id="panel">
    <div class="box" id="elapsed"><div id="etime"></div><div id="estat"></div></div>
    <div class="info"><div id="rec" class="box time"></div><div id="timeBox" class="box time"></div></div>
    <div class="btns">
      <button class="btn" id="bAgain">🔄 다시하기</button>
      <a class="btn" href="../">🏠 처음</a>
      <button class="btn" id="bMenu">☰ 메뉴</button>
      <button class="btn" id="bSound">🔊</button>
      <button class="btn holdable" id="bParent">👪 부모님<small>꾹 누르기</small></button>
    </div>
  </aside>
</div>
<div id="overlay"></div>

function getRec(){const r=LS.get(SCK,null);return (r&&r.best)?r:{best:{}};}
function bestOf(lv){const v=getRec().best[lv];return v==null?null:v;}
function renderRec(){const b=bestOf(cfg.level);$('rec').textContent='🏆 이 단계 최고: '+(b==null?'아직 없어요':'실패 '+b+'번');}

/* 경과 시간 */
const fmt=t=>{t=Math.floor(t);return Math.floor(t/60)+':'+String(t%60).padStart(2,'0');};
function renderElapsed(){const t=$('etime');if(previewing){const l=Math.max(1,Math.ceil((previewEnd-Date.now())/1000));t.textContent='👀 '+l;}else t.textContent='⏱ '+fmt(elapsed);}
setInterval(()=>{const n=Date.now(),dt=Math.min(1,(n-lastT)/1000);lastT=n;
  if(started&&!previewing&&!over&&!overlayMode&&document.visibilityState==='visible')elapsed+=dt;
  renderElapsed();},250);

/* 배치 */
function layout(){
  const b=$('board'),W=b.clientWidth,H=b.clientHeight,n=cards.length;if(!n||!W)return;
  const pad=14,gap=10;let best=null;
  /* 빈 칸이 없도록 cols×rows = n 이 되는 배열만 쓰고, 카드 비율이 가장 자연스러운 것을 골라요 */
  for(let cols=1;cols<=n;cols++){
    if(n%cols)continue;const rows=n/cols;
    const cw=(W-pad*2-gap*(cols-1))/cols,ch=(H-pad*2-gap*(rows-1))/rows,asp=cw/ch;
    if(asp<.45||asp>1.5)continue;
    const d=Math.abs(Math.log(asp/.78));
    if(!best||d<best.d)best={cols,rows,w:cw,h:ch,d};
  }
  if(!best){ /* 자연스러운 비율이 없으면: 빈칸 없는 배열 중 카드가 가장 큰 것 (비슷하면 더 넓게 펼쳐지는 쪽) */
    const cand=[];
    for(let cols=1;cols<=n;cols++){
      if(n%cols)continue;const rows=n/cols,cw=(W-pad*2-gap*(cols-1))/cols,ch=(H-pad*2-gap*(rows-1))/rows,w=Math.min(cw,ch*.78);
      if(w>0)cand.push({cols,rows,w,h:w/.78});
    }
    const mx=Math.max(...cand.map(c=>c.w));
    best=cand.filter(c=>c.w>=mx*.92).sort((a,b)=>b.cols*b.w-a.cols*a.w)[0];
  }
  const tw=best.cols*best.w+(best.cols-1)*gap,th=best.rows*best.h+(best.rows-1)*gap,ox=(W-tw)/2,oy=(H-th)/2;
  b.querySelectorAll('.c').forEach((el,i)=>{
    const r=Math.floor(i/best.cols),c=i%best.cols;
    el.style.width=best.w+'px';el.style.height=best.h+'px';
    el.style.left=(ox+c*(best.w+gap))+'px';el.style.top=(oy+r*(best.h+gap))+'px';
  });
}
function build(){
  const b=$('board');b.innerHTML='';
  cards.forEach((c,i)=>{
    const e=document.createElement('div');e.className='c';e.dataset.i=i;
    e.innerHTML='<div class="in"><div class="bk">'+BACK+'</div><div class="f" style="background:'+MON[c.m].bg+'">'+monSVG(c.m)+'</div></div>';
    b.appendChild(e);
  });
  layout();
}
const el=i=>$('board').children[i];
function setStatus(t,sub,cls){const e=$('estat');let x=t;if(cards.length)x=previewing?'잘 보고 외워요!':'실패 '+fails+'번 · 남은 짝 '+cards.filter(c=>c.s!=='done').length/2;e.textContent=x;$('elapsed').classList.toggle('ok',cls==='ok');}
function updateScore(){const left=cards.filter(c=>c.s!=='done').length/2;$('bSound').textContent=muted?'🔇 꺼짐':'🔊 소리';renderRec();}

/* 진행 */
function newGame(){
  gid++;over=false;lock=true;first=-1;fails=0;elapsed=0;lastT=Date.now();started=true;previewing=true;
  const n=PAIRS[cfg.level],ids=shuffle(MON.map((_,i)=>i)).slice(0,n);
  cards=shuffle(ids.concat(ids)).map(m=>({m,s:'up'}));
  closeOverlay();build();
  document.querySelectorAll('#board .c').forEach(e=>e.classList.add('up'));
  updateScore();
  /* 시작할 때 전체 카드를 잠깐 보여줘요: 짝이 많을수록 길게 (약 3~6초) */
  const id=gid,total=Math.min(8000,Math.round(2000+n*350));previewEnd=Date.now()+D(total);
  setStatus('잘 보고 외워요! 👀','카드가 곧 뒤집혀요','me');renderElapsed();
  setTimeout(()=>{
    if(id!==gid)return;
    cards.forEach((c,i)=>{c.s='down';el(i).classList.remove('up');});
    previewing=false;lock=false;lastT=Date.now();renderElapsed();sfx.flip();
    setStatus('같은 짝을 찾아요','카드를 두 장 뒤집어요','me');
  },D(total));
}
function reveal(i){cards[i].s='up';el(i).classList.add('up');sfx.flip();}
function onTap(i){
  unlock();
  if(lock||over||previewing||overlayMode||!cards[i]||cards[i].s!=='down')return;
  reveal(i);
  if(first<0){first=i;return;}
  resolve(first,i);first=-1;
}
function resolve(a,b){
  lock=true;const id=gid;
  setTimeout(()=>{
    if(id!==gid)return;
    if(cards[a].m===cards[b].m){
      cards[a].s=cards[b].s='done';
      el(a).classList.add('done');el(b).classList.add('done');sfx.ok();updateScore();
      if(cards.every(c=>c.s==='done')){setTimeout(()=>{if(id===gid)finish();},D(700));return;}
      setStatus('짝이 맞았어요! 🎉','계속 찾아요','ok');
      lock=false;
    }else{
      sfx.no();fails++;updateScore();
      setStatus('아쉬워요, 다시!','실패 '+fails+'번');
      setTimeout(()=>{
        if(id!==gid)return;
        cards[a].s=cards[b].s='down';el(a).classList.remove('up');el(b).classList.remove('up');
        lock=false;setStatus('같은 짝을 찾아요','카드를 두 장 뒤집어요','me');
      },D(900));
    }
  },D(650));
}
function finish(){
  over=true;const r=getRec(),old=r.best[cfg.level],isNew=(old==null||fails<old);
  if(isNew){r.best[cfg.level]=fails;LS.set(SCK,r);}
  sfx.win();renderRec();
  const nextBtn=cfg.level<7?'<button class="go" data-act="next">⬆ 더 많은 카드로 ('+PAIRS[cfg.level+1]*2+'장)</button>':'';
  openOverlay('<div class="big">'+(fails===0?'🏆':'🎉')+'</div><h2>'+(fails===0?'한 번도 안 틀렸어요!':'모두 찾았어요!')+'</h2><div class="sub">⏱ '+fmt(elapsed)+' · 실패 '+fails+'번'+(isNew?' · ⭐ 새 기록!':' · 최고 기록 '+old+'번')+'</div>'
   +nextBtn+'<button class="go'+(nextBtn?' alt':'')+'" data-act="again">한 판 더</button><button class="go alt" data-act="menu">메뉴</button>','end');
}

/* 메뉴 */
function openOverlay(h,m){overlayMode=m;const o=$('overlay');o.innerHTML='<div class="pop">'+h+'</div>';o.className='on';}
function closeOverlay(){overlayMode='';const o=$('overlay');o.className='';o.innerHTML='';}
function setLv(n){cfg.level=n;LS.set('memory.level',n);renderRec();const lc=$('lvcount');if(lc)lc.textContent=PAIRS[n]*2+'장';const t=$('lvthumb');if(!t)return;t.style.left=((n-1)/6*100)+'%';t.textContent=LVE[n];document.querySelectorAll('#lvtrack .dt').forEach((d,i)=>d.classList.toggle('on',i<n));}
function initLvBar(){
  const tr=$('lvtrack');if(!tr)return;setLv(cfg.level);let drag=false;
  const pick=e=>{const r=tr.getBoundingClientRect();setLv(Math.max(1,Math.min(7,Math.round((e.clientX-r.left)/r.width*6)+1)));};
  tr.addEventListener('pointerdown',e=>{drag=true;try{tr.setPointerCapture(e.pointerId);}catch(_){}pick(e);});
  tr.addEventListener('pointermove',e=>{if(drag)pick(e);});
  ['pointerup','pointercancel'].forEach(ev=>tr.addEventListener(ev,()=>{drag=false;}));
}
function showMenu(){
  let h='<h1><svg viewBox="-36 -28 72 56" style="width:50px;height:39px;vertical-align:-8px;margin-right:4px"><g transform="translate(-10 4) rotate(-12) scale(1.35)"><rect x="-9.5" y="-13.5" width="19" height="27" rx="3.4" fill="#fff" stroke="#14143a" stroke-width="1.3"/><rect x="-7.3" y="-11.3" width="14.6" height="22.6" rx="2.2" fill="#14143a"/><polygon points="0,-6.4 1.9,-2 6.4,-1.8 2.9,1.1 4,5.6 0,3.1 -4,5.6 -2.9,1.1 -6.4,-1.8 -1.9,-2" fill="#ffc400"/></g><g transform="translate(11 -3) rotate(10) scale(1.35)"><rect x="-9.5" y="-13.5" width="19" height="27" rx="3.4" fill="#fff" stroke="#14143a" stroke-width="1.3"/><rect x="-7.3" y="-11.3" width="14.6" height="22.6" rx="2.2" fill="#e9ddfa"/><circle cy="3" r="6.2" fill="#ff5a14"/><circle cx="-2.4" cy="1.4" r="1.9" fill="#fff"/><circle cx="2.4" cy="1.4" r="1.9" fill="#fff"/><circle cx="-2.4" cy="1.6" r=".9" fill="#14143a"/><circle cx="2.4" cy="1.6" r=".9" fill="#14143a"/><path d="M-3 5.2Q0 7.2 3 5.2" fill="none" stroke="#14143a" stroke-width=".9" stroke-linecap="round"/><path d="M-4 -2.6L-3 -6.4L-1 -3M4 -2.6L3 -6.4L1 -3" fill="#ff5a14"/></g></svg>Matching Pairs</h1><div class="sub">처음에 카드를 잠깐 보여줘요. 잘 외웠다가 카드를 두 장씩 뒤집어서 같은 짝을 모두 찾아요. 틀린 횟수가 적을수록 좋아요</div>';
  h+='<div class="row"><b>카드 개수</b> <small id="lvcount"></small> <small>단계가 높을수록 카드가 많아져요</small><div class="lvbar"><span>적게</span><div id="lvtrack">'+[1,2,3,4,5,6,7].map(n=>'<i class="dt" style="left:'+((n-1)/6*100)+'%"></i>').join('')+'<div id="lvthumb"></div></div><span>많이</span></div></div>';
  h+='<button class="go" data-act="start" style="display:flex;align-items:center;justify-content:center;line-height:1;padding:6px 0 0;font-size:34px;min-height:86px"><svg viewBox="0 0 24 24" width="30" height="30" style="vertical-align:-3px;margin-right:12px"><path d="M7 4.5v15l12-7.5z" fill="currentColor" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/></svg>Play!</button>';
  if(started&&!over)h+='<button class="go alt" data-act="close" style="margin-top:10px">계속하던 게임으로</button>';
  h+=Guard.extras();
  openOverlay(h,'menu');initLvBar();
}
$('overlay').addEventListener('click',e=>{unlock();const t=e.target.closest('[data-act]');if(!t)return;const a=t.dataset.act;if(a==='start'||a==='again')newGame();else if(a==='next'){setLv(Math.min(7,cfg.level+1));newGame();}else if(a==='menu')showMenu();else if(a==='close')closeOverlay();});
$('board').addEventListener('pointerdown',e=>{const c=e.target.closest('.c');if(c){e.preventDefault();onTap(+c.dataset.i);}});
$('bAgain').addEventListener('click',newGame);
$('bMenu').addEventListener('click',showMenu);
$('bSound').addEventListener('click',()=>{muted=!muted;updateScore();if(!muted){unlock();sfx.flip();}});
let holdT=null;const bP=$('bParent');
bP.addEventListener('pointerdown',()=>{bP.classList.add('hold');holdT=setTimeout(()=>{holdT=null;bP.classList.remove('hold');Guard.parentFlow();},900);});
['pointerup','pointerleave','pointercancel'].forEach(ev=>bP.addEventListener(ev,()=>{clearTimeout(holdT);bP.classList.remove('hold');}));
function vh(){document.documentElement.style.setProperty('--vh',(window.innerHeight/100)+'px');}
window.addEventListener('resize',()=>{vh();layout();});

vh();
cfg.level=Math.max(1,Math.min(7,LS.get('memory.level',1)));
renderRec();setStatus('Play!를 눌러요','');updateScore();
showMenu();
Guard.start({onTick:s=>{const b=$('timeBox');b.textContent=Guard.label(s);b.className='box time'+(s<=300?' low':'');},onReset:renderRec});
window.__mem={get cards(){return cards;},get over(){return over;},get fails(){return fails;},get previewing(){return previewing;},get cfg(){return cfg;},get lock(){return lock;},newGame,tap:onTap};
})();
</script>
