<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Memory</title>
<meta name="theme-color" content="#14142b">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
:root{--ink:#111;--font:"Jua","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;--vh:1vh;--good:#2f8f4e;--edge:#dccfae}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:#14142b;color:#fff;font-family:var(--font);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;color-scheme:dark}
button,a{font-family:inherit;color:inherit}
#app{height:calc(var(--vh)*100);display:flex;gap:12px;padding:10px}
#board{flex:1;min-width:0;position:relative;background:#000;border-radius:26px;border:4px solid #2b2b55}
.c{position:absolute;perspective:700px;cursor:pointer}
.in{position:absolute;inset:0;transition:transform .35s;transform-style:preserve-3d}
.c.up .in,.c.done .in{transform:rotateY(180deg)}
.f,.bk{position:absolute;inset:0;border-radius:14%/11%;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;border:3px solid #111}
.f{transform:rotateY(180deg)}
.f svg{position:absolute;left:0;top:3%;width:100%;height:100%}
.bk{background:#ff8cc6;display:flex;align-items:center;justify-content:center}
.bk svg{width:70%;height:70%}
.c.done{pointer-events:none}.c.done .f{opacity:.4;transition:opacity .5s .3s}
.c.hint .f{box-shadow:0 0 0 4px #ffe14d inset}
#panel{width:250px;display:flex;flex-direction:column;gap:10px;flex:none}
.box{background:#22224a;border-radius:18px;padding:12px 14px;border:3px solid #3a3a72}
#status{font-size:22px;line-height:1.25;min-height:80px}
#status small{display:block;font-size:14px;opacity:.7;margin-top:4px}
#status.me{background:#fff2b8;border-color:#ffd23f;color:#111}
#status.ok{background:#d7f5dc;border-color:#2f8f4e;color:#111}
#score{font-size:19px;text-align:center}
.time{font-size:16px;padding:8px 14px;text-align:center}.time.low{background:#6b4b00}
.info{display:flex;flex-direction:column;gap:10px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{min-height:54px;border:0;border-radius:16px;background:#fff;color:#111;box-shadow:0 4px 0 #9a9ac0;font-size:18px;cursor:pointer;padding:6px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #9a9ac0}
.btn small{font-size:12px;opacity:.6}
.btn.holdable{background-image:linear-gradient(#ffcf70,#ffcf70);background-repeat:no-repeat;background-size:0 100%}
.btn.hold{background-size:100% 100%;transition:background-size .9s linear}
#overlay{position:fixed;inset:0;background:rgba(10,10,30,.7);display:none;align-items:center;justify-content:center;padding:12px;z-index:5}
#overlay.on{display:flex}
.pop{background:#fffdf6;color:#2a2a33;border-radius:24px;padding:16px 22px;width:min(560px,100%);max-height:100%;overflow:auto;text-align:center;box-shadow:0 8px 0 rgba(0,0,0,.3)}
.pop h1{margin:0 0 4px;font-size:34px}.pop h2{margin:0 0 8px;font-size:28px}
.sub{font-size:15px;opacity:.7;margin:0 0 6px}
.row{margin:8px 0}.row>b{display:inline-block;font-size:17px;margin-bottom:4px;font-weight:400;opacity:.75}.row small{font-size:13px;opacity:.6}
.go{width:100%;min-height:60px;margin-top:8px;border:0;border-radius:18px;background:var(--good);color:#fff;font-size:26px;box-shadow:0 5px 0 #20703a;cursor:pointer;display:block;text-align:center;text-decoration:none;line-height:60px;padding:0}
.go:active{transform:translateY(4px);box-shadow:0 1px 0 #20703a}
.go.alt{background:#fff;color:#2a2a33;box-shadow:0 5px 0 var(--edge);font-size:20px;min-height:52px;line-height:52px}
.links{display:flex;gap:8px;flex-wrap:wrap}.links .go{margin-top:8px;flex:1;min-width:90px}
.big{font-size:56px;line-height:1.1}
.lvbar{display:flex;align-items:center;gap:12px;margin:10px 4px 4px;font-size:17px}.lvbar span{white-space:nowrap}
#lvtrack{position:relative;flex:1;height:52px;margin:0 22px;touch-action:none;cursor:pointer}
#lvtrack::before{content:'';position:absolute;left:0;right:0;top:50%;height:8px;margin-top:-4px;border-radius:4px;background:#e4ddc9}
#lvtrack .dt{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:#fff;border:3px solid #cbbf9f}
#lvtrack .dt.on{border-color:#2d8f4e;background:#bfe8cc}
#lvthumb{position:absolute;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:#fff;border:4px solid #2d8f4e;box-shadow:0 3px 0 rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;font-size:24px;transition:left .08s}
@media (orientation:portrait){
  #app{flex-direction:column;gap:8px}
  #panel{width:100%;flex-direction:row;flex-wrap:wrap}
  #panel>.box{flex:1 1 45%}#status{min-height:60px;font-size:19px;flex-basis:100%}
  .btns{flex-basis:100%;grid-template-columns:repeat(4,1fr)}
}
</style>
</head>
<body>
<div id="app">
  <div id="board"></div>
  <aside id="panel">
    <div id="status" class="box"></div>
    <div class="box" id="score"></div>
    <div class="info"><div id="rec" class="box time"></div><div id="timeBox" class="box time"></div></div>
    <div class="btns">
      <button class="btn" id="bAgain">🔄 다시하기</button>
      <a class="btn" href="../">🏠 처음</a>
      <button class="btn" id="bMenu">☰ 메뉴</button>
      <button class="btn" id="bSound">🔊</button>
      <button class="btn holdable" id="bParent">👪 부모님<small>꾹 누르기</small></button>
    </div>
  </aside>
</div>
<div id="overlay"></div>
<script src="../algakki/guard.js"></script>
<script>
(function(){
const $=id=>document.getElementById(id);
const LS=Guard.LS;
const LVE=['','🐣','🐥','🐰','🦊','🐯','🦁','🐲'];
const PAIRS=[0,6,6,8,8,10,10,12];
const REMEMBER=[0,.18,.32,.48,.64,.8,.92,1];
const S='stroke="#111" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"';
/* 몬스터 12종 (직접 그린 그림) */
const MON=[
 {bg:'#3d8bff',svg:`<g ${S}><rect x="33" y="78" width="12" height="14" rx="3" fill="#ffd23f"/><rect x="55" y="78" width="12" height="14" rx="3" fill="#ffd23f"/><ellipse cx="50" cy="50" rx="30" ry="31" fill="#ff4b3e"/><circle cx="50" cy="46" r="15" fill="#fff"/><circle cx="52" cy="47" r="6" fill="#111"/><path d="M42 66 q8 7 16 0" fill="none"/><path d="M22 52 q-9 -6 -10 -16 M78 52 q9 -6 10 -16" fill="none"/></g>`},
 {bg:'#ffd23f',svg:`<g ${S}><rect x="30" y="12" width="40" height="74" rx="20" fill="#3ec65a"/><circle cx="43" cy="36" r="8" fill="#fff"/><circle cx="59" cy="36" r="8" fill="#fff"/><circle cx="45" cy="37" r="3" fill="#111"/><circle cx="61" cy="37" r="3" fill="#111"/><path d="M42 56 q8 8 16 0" fill="none"/><path d="M30 60 q-12 6 -14 18 M70 60 q12 6 14 18" fill="none"/><ellipse cx="42" cy="90" rx="8" ry="4" fill="#111"/><ellipse cx="60" cy="90" rx="8" ry="4" fill="#111"/></g>`},
 {bg:'#ff4b3e',svg:`<g ${S}><path d="M22 90 V48 a28 28 0 0 1 56 0 V90 l-9 -8 l-9 8 l-10 -8 l-10 8 l-9 -8 z" fill="#fff"/><circle cx="40" cy="46" r="4" fill="#111"/><circle cx="60" cy="46" r="4" fill="#111"/><ellipse cx="50" cy="62" rx="8" ry="6" fill="#111"/><circle cx="32" cy="58" r="4" fill="#ff8cc6" stroke="none"/><circle cx="68" cy="58" r="4" fill="#ff8cc6" stroke="none"/></g>`},
 {bg:'#b9b9c4',svg:`<g ${S}><path d="M40 88 l-4 6 h14 M62 88 l-4 6 h14" fill="none" stroke="#ff8a00" stroke-width="6"/><circle cx="50" cy="52" r="32" fill="#fff"/><ellipse cx="50" cy="62" rx="14" ry="8" fill="#ff8a00"/><circle cx="40" cy="44" r="4" fill="#111"/><circle cx="60" cy="44" r="4" fill="#111"/></g>`},
 {bg:'#3d8bff',svg:`<g ${S}><ellipse cx="38" cy="22" rx="8" ry="20" fill="#ff8cc6"/><ellipse cx="62" cy="22" rx="8" ry="20" fill="#ff8cc6"/><ellipse cx="50" cy="62" rx="28" ry="30" fill="#ff8cc6"/><circle cx="40" cy="56" r="4" fill="#111"/><circle cx="60" cy="56" r="4" fill="#111"/><path d="M44 68 h12 v8 h-12 z" fill="#fff"/><path d="M50 68 v8" fill="none" stroke-width="2"/></g>`},
 {bg:'#ffd23f',svg:`<g ${S}><path d="M26 34 l8 -22 l12 16 M74 34 l-8 -22 l-12 16" fill="#ff8a00"/><circle cx="50" cy="56" r="32" fill="#8b5cf6"/><circle cx="38" cy="48" r="7" fill="#fff"/><circle cx="62" cy="48" r="7" fill="#fff"/><circle cx="39" cy="49" r="3" fill="#111"/><circle cx="63" cy="49" r="3" fill="#111"/><path d="M34 68 l6 7 l5 -7 l5 7 l5 -7 l6 7 l5 -7" fill="#fff"/></g>`},
 {bg:'#ffffff',svg:`<g ${S}><path d="M76 50 l16 -16 v32 z" fill="#ff8a00"/><ellipse cx="46" cy="50" rx="32" ry="24" fill="#ff8a00"/><path d="M40 30 q6 -10 16 -2" fill="#ffd23f"/><circle cx="30" cy="46" r="6" fill="#fff"/><circle cx="31" cy="46" r="2.5" fill="#111"/><path d="M22 60 q8 5 14 0" fill="none"/><path d="M38 74 v14 M56 72 v16" fill="none" stroke-width="6"/></g>`},
 {bg:'#ff4b3e',svg:`<g ${S}><ellipse cx="50" cy="62" rx="34" ry="26" fill="#14b8a6"/><circle cx="34" cy="38" r="11" fill="#fff"/><circle cx="66" cy="38" r="11" fill="#fff"/><circle cx="36" cy="39" r="4" fill="#111"/><circle cx="64" cy="39" r="4" fill="#111"/><path d="M26 64 q24 18 48 0" fill="#fff"/><path d="M34 88 v6 M66 88 v6" fill="none" stroke-width="7"/></g>`},
 {bg:'#ffd23f',svg:`<g ${S}><path d="M62 24 q10 -14 22 -8" fill="none"/><path d="M84 14 l4 6 l6 0 l-4 5 l2 6 l-8 -4 l-8 4 l2 -6 l-4 -5 l6 0 z" fill="#ff4b3e"/><circle cx="48" cy="56" r="30" fill="#2a2a33"/><circle cx="38" cy="52" r="7" fill="#fff"/><circle cx="58" cy="52" r="7" fill="#fff"/><circle cx="40" cy="53" r="3" fill="#111"/><circle cx="60" cy="53" r="3" fill="#111"/><path d="M40 70 q8 6 16 0" fill="none" stroke="#fff"/><path d="M36 86 v8 M60 86 v8" fill="none" stroke-width="7"/></g>`},
 {bg:'#3d8bff',svg:`<g ${S}><path d="M24 70 a14 14 0 0 1 4 -26 a18 18 0 0 1 34 -6 a16 16 0 0 1 16 24 a12 12 0 0 1 -4 8 z" fill="#e8e8f2"/><circle cx="40" cy="58" r="3.5" fill="#111"/><circle cx="58" cy="58" r="3.5" fill="#111"/><path d="M44 66 q5 4 10 0" fill="none"/><path d="M38 76 v14 M60 76 v14" fill="none" stroke-width="6"/></g>`},
 {bg:'#b9b9c4',svg:`<g ${S}><rect x="38" y="50" width="24" height="38" rx="8" fill="#fff4d6"/><path d="M14 54 a36 30 0 0 1 72 0 z" fill="#ff4b3e"/><circle cx="34" cy="42" r="5" fill="#fff"/><circle cx="52" cy="34" r="6" fill="#fff"/><circle cx="68" cy="44" r="4" fill="#fff"/><circle cx="45" cy="66" r="3" fill="#111"/><circle cx="56" cy="66" r="3" fill="#111"/><path d="M45 75 q5 4 10 0" fill="none"/></g>`},
 {bg:'#ff4b3e',svg:`<g ${S}><path d="M34 22 h32 l-4 -8 h-24 z" fill="#2a2a33"/><circle cx="50" cy="34" r="16" fill="#fff"/><circle cx="50" cy="70" r="24" fill="#fff"/><circle cx="44" cy="31" r="2.5" fill="#111"/><circle cx="57" cy="31" r="2.5" fill="#111"/><path d="M52 36 l16 3 l-16 3 z" fill="#ff8a00"/><circle cx="50" cy="62" r="2.5" fill="#111"/><circle cx="50" cy="74" r="2.5" fill="#111"/></g>`}
];
const monSVG=i=>'<svg viewBox="0 0 100 100">'+MON[i].svg+'</svg>';
const BACK='<svg viewBox="0 0 100 100"><polygon points="50,6 58,34 86,24 68,48 94,62 64,66 70,94 50,76 30,94 36,66 6,62 32,48 14,24 42,34" fill="#17163f" stroke="#111" stroke-width="4" stroke-linejoin="round"/><circle cx="50" cy="50" r="10" fill="#ffd23f" stroke="#111" stroke-width="4"/></svg>';

let cfg={level:1},cards=[],turn=0,first=-1,lock=false,over=false,sa=0,sb=0,gid=0,known=new Set(),overlayMode='',muted=false,lvNote='',started=false;
const D=ms=>window.__fast?8:ms;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};

/* sound */
let AC;
function unlock(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){}}
function tone(f0,f1,d,t,v,dl){if(muted)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const t0=AC.currentTime+(dl||0),o=AC.createOscillator(),g=AC.createGain();o.type=t||'sine';o.frequency.setValueAtTime(f0,t0);if(f1!==f0)o.frequency.exponentialRampToValueAtTime(f1,t0+d);g.gain.setValueAtTime(v||.08,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+d);o.connect(g);g.connect(AC.destination);o.start(t0);o.stop(t0+d);}catch(e){}}
const sfx={flip:()=>tone(520,640,.07,'triangle',.06),ok:()=>{tone(660,660,.12,'triangle',.09);tone(880,880,.18,'triangle',.09,.1)},no:()=>tone(260,190,.18,'sawtooth',.04),
 win:()=>[523,659,784,1046,1318].forEach((f,i)=>tone(f,f,.22,'triangle',.09,i*.12)),lose:()=>[392,330,262].forEach((f,i)=>tone(f,f,.25,'sine',.09,i*.18))};

/* 전적 */
const SCK='score.memory';
function getScore(){const d={a:0,b:0,d:0};return LS.get(SCK,d)||d;}
function renderRec(){const r=getScore();$('rec').textContent='🏆 나 '+r.a+' : '+r.b+' 컴퓨터'+(r.d?' · 무 '+r.d:'');}

/* 배치 */
function layout(){
  const b=$('board'),W=b.clientWidth,H=b.clientHeight,n=cards.length;if(!n||!W)return;
  let best=null;
  for(let cols=2;cols<=n;cols++){
    const rows=Math.ceil(n/cols),pad=14,gap=10;
    const cw=(W-pad*2-gap*(cols-1))/cols,ch=(H-pad*2-gap*(rows-1))/rows;
    const w=Math.min(cw,ch*0.78),h=w/0.78;
    if(!best||w>best.w)best={cols,rows,w,h,gap,pad};
  }
  const tw=best.cols*best.w+(best.cols-1)*best.gap,th=best.rows*best.h+(best.rows-1)*best.gap,ox=(W-tw)/2,oy=(H-th)/2;
  b.querySelectorAll('.c').forEach((el,i)=>{
    const r=Math.floor(i/best.cols),c=i%best.cols;
    el.style.width=best.w+'px';el.style.height=best.h+'px';
    el.style.left=(ox+c*(best.w+best.gap))+'px';el.style.top=(oy+r*(best.h+best.gap))+'px';
  });
}
function build(){
  const b=$('board');b.innerHTML='';
  cards.forEach((c,i)=>{
    const e=document.createElement('div');e.className='c';e.dataset.i=i;
    e.innerHTML='<div class="in"><div class="bk">'+BACK+'</div><div class="f" style="background:'+MON[c.m].bg+'">'+monSVG(c.m)+'</div></div>';
    b.appendChild(e);
  });
  layout();
}
const el=i=>$('board').children[i];
function setStatus(t,s,cls){const e=$('status');e.className='box'+(cls?' '+cls:'');e.innerHTML=t+(s?'<small>'+s+'</small>':'');}
function updateScore(){const left=cards.filter(c=>c.s!=='done').length/2;$('score').textContent='나 '+sa+' : '+sb+' 컴퓨터 · 남은 짝 '+left;$('bSound').textContent=muted?'🔇 꺼짐':'🔊 소리';renderRec();}

/* 진행 */
function newGame(){
  gid++;over=false;lock=false;first=-1;turn=0;sa=0;sb=0;known=new Set();lvNote='';started=true;
  const n=PAIRS[cfg.level],ids=shuffle(MON.map((_,i)=>i)).slice(0,n);
  cards=shuffle(ids.concat(ids)).map(m=>({m,s:'down'}));
  closeOverlay();build();updateScore();
  setStatus('내 차례!','카드를 두 장 뒤집어서 같은 짝을 찾아요','me');
}
function observe(i){if(Math.random()<REMEMBER[cfg.level])known.add(i);else known.delete(i);}
function reveal(i){cards[i].s='up';el(i).classList.add('up');sfx.flip();observe(i);}
function onTap(i){
  unlock();
  if(lock||over||turn!==0||overlayMode||!cards[i]||cards[i].s!=='down')return;
  reveal(i);
  if(first<0){first=i;return;}
  resolve(first,i);first=-1;
}
function resolve(a,b){
  lock=true;const id=gid,mine=turn===0;
  setTimeout(()=>{
    if(id!==gid)return;
    if(cards[a].m===cards[b].m){
      cards[a].s=cards[b].s='done';known.delete(a);known.delete(b);
      el(a).classList.add('done');el(b).classList.add('done');sfx.ok();
      if(mine)sa++;else sb++;updateScore();
      if(cards.every(c=>c.s==='done')){setTimeout(()=>{if(id===gid)finish();},D(700));return;}
      setStatus(mine?'짝이 맞았어요! 🎉':'컴퓨터가 짝을 찾았어요','한 번 더!',mine?'ok':'');
      lock=false;if(!mine)setTimeout(()=>{if(id===gid)cpuMove();},D(700));
    }else{
      sfx.no();
      setTimeout(()=>{
        if(id!==gid)return;
        cards[a].s=cards[b].s='down';el(a).classList.remove('up');el(b).classList.remove('up');
        turn=mine?1:0;lock=false;
        if(turn===1){setStatus('컴퓨터 차례','');setTimeout(()=>{if(id===gid)cpuMove();},D(700));}
        else setStatus('내 차례!','카드를 두 장 뒤집어요','me');
      },D(900));
    }
  },D(650));
}
function downIdx(){return cards.map((c,i)=>c.s==='down'?i:-1).filter(i=>i>=0);}
function cpuMove(){
  if(over)return;const id=gid;turn=1;setStatus('컴퓨터 차례','');lock=true;
  const downs=downIdx(),kn=[...known].filter(i=>cards[i].s==='down');
  let pair=null;
  for(let x=0;x<kn.length&&!pair;x++)for(let y=x+1;y<kn.length;y++)if(cards[kn[x]].m===cards[kn[y]].m){pair=[kn[x],kn[y]];break;}
  let a,b;
  const unknown=downs.filter(i=>!known.has(i));
  if(pair){a=pair[0];b=pair[1];}
  else{
    a=(unknown.length?unknown:downs)[Math.floor(Math.random()*(unknown.length||downs.length))];
  }
  setTimeout(()=>{
    if(id!==gid)return;reveal(a);
    if(!pair){
      const partner=[...known].find(i=>i!==a&&cards[i].s==='down'&&cards[i].m===cards[a].m);
      if(partner!==undefined)b=partner;
      else{const rest=downIdx().filter(i=>i!==a),un=rest.filter(i=>!known.has(i)),pool=un.length?un:rest;b=pool[Math.floor(Math.random()*pool.length)];}
    }
    setTimeout(()=>{if(id!==gid)return;reveal(b);resolve(a,b);},D(850));
  },D(700));
}
function finish(){
  over=true;const k=sa>sb?'a':sa<sb?'b':'d',sc=getScore();sc[k]++;LS.set(SCK,sc);
  const prev=cfg.level;
  if(k==='a'){cfg.level=Math.min(7,cfg.level+1);lvNote=cfg.level>prev?'⬆ 컴퓨터가 '+LVE[cfg.level]+' '+cfg.level+'단계로 올라가요!':'🏅 가장 높은 단계예요!';}
  else if(k==='b'){cfg.level=Math.max(1,cfg.level-1);if(cfg.level<prev)lvNote='⬇ 컴퓨터가 '+LVE[cfg.level]+' '+cfg.level+'단계로 내려가요';}
  LS.set('memory.level',cfg.level);if(k==='b')sfx.lose();else sfx.win();
  renderRec();
  openOverlay('<div class="big">'+(k==='a'?'🏆':k==='b'?'🤖':'🤝')+'</div><h2>'+(k==='a'?'내가 이겼어요! 🎉':k==='b'?'컴퓨터가 이겼어요':'무승부예요')+'</h2><div class="sub">나 '+sa+' : '+sb+' 컴퓨터</div>'
   +(lvNote?'<div style="font-size:22px;margin:6px 0">'+lvNote+'</div>':'')+'<button class="go" data-act="again">한 판 더</button><button class="go alt" data-act="menu">메뉴</button>','end');
}

/* 메뉴 */
function openOverlay(h,m){overlayMode=m;const o=$('overlay');o.innerHTML='<div class="pop">'+h+'</div>';o.className='on';}
function closeOverlay(){overlayMode='';const o=$('overlay');o.className='';o.innerHTML='';}
function setLv(n){cfg.level=n;LS.set('memory.level',n);const t=$('lvthumb');if(!t)return;t.style.left=((n-1)/6*100)+'%';t.textContent=LVE[n];document.querySelectorAll('#lvtrack .dt').forEach((d,i)=>d.classList.toggle('on',i<n));}
function initLvBar(){
  const tr=$('lvtrack');if(!tr)return;setLv(cfg.level);let drag=false;
  const pick=e=>{const r=tr.getBoundingClientRect();setLv(Math.max(1,Math.min(7,Math.round((e.clientX-r.left)/r.width*6)+1)));};
  tr.addEventListener('pointerdown',e=>{drag=true;try{tr.setPointerCapture(e.pointerId);}catch(_){}pick(e);});
  tr.addEventListener('pointermove',e=>{if(drag)pick(e);});
  ['pointerup','pointercancel'].forEach(ev=>tr.addEventListener(ev,()=>{drag=false;}));
}
function showMenu(){
  let h='<h1>🧠 Memory</h1><div class="sub">카드를 두 장씩 뒤집어서 같은 짝을 찾아요. 컴퓨터보다 많이 찾으면 이겨요</div>';
  h+='<div class="row"><b>컴퓨터 실력</b> <small>이기면 올라가고, 지면 내려가요</small><div class="lvbar"><span>쉬움</span><div id="lvtrack">'+[1,2,3,4,5,6,7].map(n=>'<i class="dt" style="left:'+((n-1)/6*100)+'%"></i>').join('')+'<div id="lvthumb"></div></div><span>어려움</span></div></div>';
  h+='<button class="go" data-act="start">시작하기</button>';
  if(started&&!over)h+='<button class="go alt" data-act="close">계속하던 게임으로</button>';
  h+='<div class="links"><a class="go alt" href="../">🏠 처음</a><a class="go alt" href="../chess/">♟ Chess</a><a class="go alt" href="../algakki/">🪨 알까기</a><a class="go alt" href="../multiply/">✖️ 곱셈</a><a class="go alt" href="../connect4/">🔴 Connect 4</a><a class="go alt" href="../spot/">👀 Spot It</a><a class="go alt" href="../uno/">🃏 UNO</a></div>';
  openOverlay(h,'menu');initLvBar();
}
$('overlay').addEventListener('click',e=>{unlock();const t=e.target.closest('[data-act]');if(!t)return;const a=t.dataset.act;if(a==='start'||a==='again')newGame();else if(a==='menu')showMenu();else if(a==='close')closeOverlay();});
$('board').addEventListener('pointerdown',e=>{const c=e.target.closest('.c');if(c){e.preventDefault();onTap(+c.dataset.i);}});
$('bAgain').addEventListener('click',newGame);
$('bMenu').addEventListener('click',showMenu);
$('bSound').addEventListener('click',()=>{muted=!muted;updateScore();if(!muted){unlock();sfx.flip();}});
let holdT=null;const bP=$('bParent');
bP.addEventListener('pointerdown',()=>{bP.classList.add('hold');holdT=setTimeout(()=>{holdT=null;bP.classList.remove('hold');Guard.parentFlow();},900);});
['pointerup','pointerleave','pointercancel'].forEach(ev=>bP.addEventListener(ev,()=>{clearTimeout(holdT);bP.classList.remove('hold');}));
function vh(){document.documentElement.style.setProperty('--vh',(window.innerHeight/100)+'px');}
window.addEventListener('resize',()=>{vh();layout();});

vh();
cfg.level=Math.max(1,Math.min(7,LS.get('memory.level',1)));
renderRec();setStatus('시작하기를 눌러요','');updateScore();
showMenu();
Guard.start({onTick:s=>{const b=$('timeBox');b.textContent=Guard.label(s);b.className='box time'+(s<=300?' low':'');},onReset:renderRec});
window.__mem={get cards(){return cards;},get turn(){return turn;},get over(){return over;},get sa(){return sa;},get sb(){return sb;},get cfg(){return cfg;},get lock(){return lock;},newGame,tap:onTap};
})();
</script>
</body>
