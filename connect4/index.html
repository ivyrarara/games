<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Connect 4</title>
<meta name="theme-color" content="#f4ecd8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
:root{--bg:#f4ecd8;--ink:#2a2a33;--card:#fffdf6;--edge:#dccfae;--accent:#e4572e;--good:#2f8f4e;
  --font:"Jua","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;--vh:1vh}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--ink);
  font-family:var(--font);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;color-scheme:light}
button,a{font-family:inherit;color:inherit}
#app{height:calc(var(--vh)*100);display:flex;align-items:center;justify-content:center;gap:14px;padding:10px}
#stage{--bs:min(calc(var(--vh)*100 - 20px), calc(100vw - 300px));width:var(--bs);height:var(--bs);flex:none}
#cv{width:100%;height:100%;display:block;touch-action:none}
#panel{width:260px;display:flex;flex-direction:column;gap:10px}
.box{background:var(--card);border-radius:18px;border:2px solid var(--edge);padding:12px 14px}
#status{font-size:22px;line-height:1.25;min-height:84px}
#status small{display:block;font-size:14px;opacity:.7;margin-top:4px;line-height:1.3}
#status.warn{background:#ffe4dc;border-color:var(--accent)}
.time{font-size:17px;padding:8px 14px;text-align:center}
.time.low{background:#fff0c9;border-color:#e0a100}
.info{display:flex;flex-direction:column;gap:10px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{min-height:56px;border:0;border-radius:16px;background:#fff;box-shadow:0 4px 0 var(--edge);font-size:18px;cursor:pointer;padding:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;text-decoration:none}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--edge)}
.btn:disabled{opacity:.4}
.btn small{font-size:12px;opacity:.6}
.btn.wide{grid-column:1/3}
.btn.holdable{background-image:linear-gradient(#ffcf70,#ffcf70);background-repeat:no-repeat;background-size:0 100%}
.btn.hold{background-size:100% 100%;transition:background-size .9s linear}
#overlay{position:fixed;inset:0;background:rgba(40,35,25,.55);display:none;align-items:center;justify-content:center;padding:12px;z-index:5}
#overlay.on{display:flex}
.card{background:var(--card);border-radius:24px;padding:18px 22px;width:min(560px,100%);max-height:100%;overflow:auto;text-align:center;box-shadow:0 8px 0 rgba(0,0,0,.18)}
.card h1{margin:0 0 4px;font-size:34px}.card h2{margin:0 0 10px;font-size:28px}
.sub{font-size:16px;opacity:.7;margin:0 0 6px}
.row{margin:10px 0}.row>b{display:inline-block;font-size:17px;margin-bottom:6px;font-weight:400;opacity:.75}
.row small{font-size:13px;opacity:.6}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.chip{min-height:54px;padding:0 18px;border-radius:16px;border:3px solid var(--edge);background:#fff;font-size:19px;cursor:pointer}
.chip.on{border-color:var(--good);background:#e3f5e7}
.go{width:100%;min-height:64px;margin-top:8px;border:0;border-radius:18px;background:var(--good);color:#fff;font-size:26px;box-shadow:0 5px 0 #20703a;cursor:pointer;display:block;text-align:center;text-decoration:none;line-height:64px;padding:0}
.go:active{transform:translateY(4px);box-shadow:0 1px 0 #20703a}
.go.alt{background:#fff;color:var(--ink);box-shadow:0 5px 0 var(--edge);margin-top:10px;font-size:21px;min-height:56px;line-height:56px}
.links{display:flex;gap:8px}.links .go{margin-top:10px}
.big{font-size:56px;line-height:1.1}
.lvbar{display:flex;align-items:center;gap:12px;margin:10px 4px 4px;font-size:17px}
.lvbar span{white-space:nowrap}
#lvtrack{position:relative;flex:1;height:52px;margin:0 22px;touch-action:none;cursor:pointer}
#lvtrack::before{content:'';position:absolute;left:0;right:0;top:50%;height:8px;margin-top:-4px;border-radius:4px;background:#e4ddc9}
#lvtrack .dt{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:#fff;border:3px solid #cbbf9f}
#lvtrack .dt.on{border-color:#2d8f4e;background:#bfe8cc}
#lvthumb{position:absolute;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:#fff;border:4px solid #2d8f4e;box-shadow:0 3px 0 rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;font-size:24px;transition:left .08s}
@media (orientation:portrait){
  #app{flex-direction:column;gap:10px}
  #stage{--bs:min(calc(100vw - 20px), calc(var(--vh)*100 - 330px))}
  #panel{width:min(100%,640px);gap:8px}
  #status{min-height:70px;font-size:20px}
  .info{flex-direction:row;gap:8px}.info>.box{flex:1}
  .btns{grid-template-columns:repeat(4,1fr)}.btn.wide{grid-column:auto}
  .btn{font-size:15px;min-height:52px}
}
@media (max-height:520px) and (orientation:landscape){#status{min-height:70px;font-size:20px}#panel{gap:7px}}
</style>
</head>
<body>
<div id="app">
  <div id="stage"><canvas id="cv"></canvas></div>
  <aside id="panel">
    <div id="status" class="box"></div>
    <div class="info"><div id="rec" class="box time"></div><div id="timeBox" class="box time"></div></div>
    <div class="btns">
      <button class="btn" id="bUndo">↩ 무르기</button>
      <button class="btn" id="bAgain">🔄 다시하기</button>
      <a class="btn" href="../">🏠 처음</a>
      <button class="btn" id="bMenu">☰ 메뉴</button>
      <button class="btn" id="bSound">🔊 소리</button>
      <button class="btn holdable wide" id="bParent">👪 부모님<small>꾹 누르기</small></button>
    </div>
  </aside>
</div>
<div id="overlay"></div>
<script src="../algakki/guard.js"></script>
<script>
(function(){
const $=id=>document.getElementById(id);
const W=7,H=6,LS=Guard.LS;
const LVE=['','🐣','🐥','🐰','🦊','🐯','🦁','🐲'];
let b=new Int8Array(42),turn=1,over=false,winner=0,winCells=null,moves=[],busy=false,thinking=false,gameId=0,muted=false,overlayMode='',ghost=-1,anim=new Map(),shakeCol=-1,shakeT=0,lvNote='';
let cfg={mode:'cpu',level:1,color:1};
const cv=$('cv'),ctx=cv.getContext('2d');
let cell=60;
function vh(){ document.documentElement.style.setProperty('--vh',(window.innerHeight/100)+'px'); resize(); }
function resize(){ const dpr=Math.min(window.devicePixelRatio||1,2),w=cv.clientWidth||300; cv.width=Math.round(w*dpr); cv.height=Math.round(w*dpr); cell=cv.width/7; }
window.addEventListener('resize',vh);

/* ---------- sound ---------- */
let AC;
function unlock(){ try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume(); }catch(e){} }
function tone(f0,f1,d,type,v,delay){
  if(muted) return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const t0=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();
    o.type=type||'sine'; o.frequency.setValueAtTime(f0,t0); if(f1!==f0) o.frequency.exponentialRampToValueAtTime(f1,t0+d);
    g.gain.setValueAtTime(v||.08,t0); g.gain.exponentialRampToValueAtTime(.0001,t0+d);
    o.connect(g); g.connect(AC.destination); o.start(t0); o.stop(t0+d);
  }catch(e){}
}
const sfx={
  land:()=>tone(300,150,.1,'triangle',.1),
  no:()=>tone(230,170,.2,'sawtooth',.045),
  win:()=>[523,659,784,1046,1318].forEach((f,i)=>tone(f,f,.22,'triangle',.09,i*.12)),
  lose:()=>[392,330,262].forEach((f,i)=>tone(f,f,.25,'sine',.09,i*.18))
};

/* ---------- 규칙 ---------- */
const idx=(r,c)=>r*W+c;
function dropRow(bd,c){ for(let r=H-1;r>=0;r--) if(!bd[idx(r,c)]) return r; return -1; }
const DIRS=[[0,1],[1,0],[1,1],[1,-1]];
function lineAt(bd,r,c){
  const p=bd[idx(r,c)]; if(!p) return null;
  for(const [dr,dc] of DIRS){
    const cells=[[r,c]];
    for(const s of [1,-1]){
      let rr=r+dr*s,cc=c+dc*s;
      while(rr>=0&&rr<H&&cc>=0&&cc<W&&bd[idx(rr,cc)]===p){ cells.push([rr,cc]); rr+=dr*s; cc+=dc*s; }
    }
    if(cells.length>=4) return cells;
  }
  return null;
}
const legalCols=bd=>{ const a=[]; for(let c=0;c<W;c++) if(bd[idx(0,c)]===0) a.push(c); return a; };
const ORDER=[3,2,4,1,5,0,6];

/* ---------- 컴퓨터 (7단계) ---------- */
const AI={1:{r:.8,d:1},2:{r:.5,d:1},3:{r:.3,d:2},4:{r:.15,d:3},5:{r:.05,d:4},6:{r:0,d:5},7:{r:0,d:7}};
function evalB(bd,p){
  let sc=0;
  for(let r=0;r<H;r++) if(bd[idx(r,3)]===p) sc+=3; else if(bd[idx(r,3)]===-p) sc-=3;
  const win=(a,bb,c,d)=>{
    let m=0,o=0,e=0;
    for(const v of [a,bb,c,d]){ if(v===p) m++; else if(v===-p) o++; else e++; }
    if(m&&o) return 0;
    if(m===3) return 5; if(m===2) return 2; if(o===3) return -5; if(o===2) return -2; return 0;
  };
  for(let r=0;r<H;r++) for(let c=0;c<W;c++){
    if(c+3<W) sc+=win(bd[idx(r,c)],bd[idx(r,c+1)],bd[idx(r,c+2)],bd[idx(r,c+3)]);
    if(r+3<H) sc+=win(bd[idx(r,c)],bd[idx(r+1,c)],bd[idx(r+2,c)],bd[idx(r+3,c)]);
    if(r+3<H&&c+3<W) sc+=win(bd[idx(r,c)],bd[idx(r+1,c+1)],bd[idx(r+2,c+2)],bd[idx(r+3,c+3)]);
    if(r+3<H&&c-3>=0) sc+=win(bd[idx(r,c)],bd[idx(r+1,c-1)],bd[idx(r+2,c-2)],bd[idx(r+3,c-3)]);
  }
  return sc;
}
function negamax(bd,d,alpha,beta,p,lastR,lastC){
  if(lastR>=0&&lineAt(bd,lastR,lastC)) return -1000-d;
  if(d===0) return evalB(bd,p);
  let any=false,best=-1e9;
  for(const c of ORDER){
    const r=dropRow(bd,c); if(r<0) continue;
    any=true; bd[idx(r,c)]=p;
    const v=-negamax(bd,d-1,-beta,-alpha,-p,r,c);
    bd[idx(r,c)]=0;
    if(v>best) best=v;
    if(v>alpha) alpha=v;
    if(alpha>=beta) break;
  }
  return any?best:0;
}
function chooseCol(bd,p,level){
  const cols=legalCols(bd); if(!cols.length) return -1;
  const cfgL=AI[level]||AI[3];
  const tryWin=q=>{ for(const c of cols){ const r=dropRow(bd,c); bd[idx(r,c)]=q; const w=!!lineAt(bd,r,c); bd[idx(r,c)]=0; if(w) return c; } return -1; };
  let c=tryWin(p); if(c>=0) return c;
  if(Math.random()<cfgL.r) return cols[Math.floor(Math.random()*cols.length)];
  if(level>=2){ c=tryWin(-p); if(c>=0) return c; }
  let best=-1e9,pool=[];
  for(const col of ORDER){
    const r=dropRow(bd,col); if(r<0) continue;
    bd[idx(r,col)]=p;
    const v=-negamax(bd,cfgL.d-1,-1e9,1e9,-p,r,col);
    bd[idx(r,col)]=0;
    if(v>best){ best=v; pool=[col]; } else if(v===best) pool.push(col);
  }
  return pool[Math.floor(Math.random()*pool.length)];
}

/* ---------- 게임 진행 ---------- */
const isCpuTurn=()=>cfg.mode==='cpu'&&turn!==cfg.color;
function rebuild(n){
  b=new Int8Array(42); turn=1; moves=moves.slice(0,n); winCells=null; winner=0; over=false;
  moves.forEach((c,i)=>{ const p=i%2===0?1:-1,r=dropRow(b,c); b[idx(r,c)]=p; turn=-p; });
  if(moves.length){ const c=moves[moves.length-1],r=dropRow(b,c)+1; const w=lineAt(b,r,c); if(w){ winCells=w; winner=b[idx(r,c)]; over=true; } else if(!legalCols(b).length){ over=true; winner=0; } }
}
function newGame(){
  gameId++; moves=[]; anim.clear(); busy=false; thinking=false; lvNote='';
  rebuild(0); closeOverlay(); saveGame(); updateUI(); maybeCpu();
}
function saveGame(){ LS.set('c4.game',{cfg}); }
function loadSaved(){
  const sv=LS.get('c4.game',null); if(!sv||!sv.cfg) return false;
  cfg=Object.assign(cfg,sv.cfg); return false;   // 설정만 복원, 판은 항상 새로
}
function play(c){
  if(over||busy) return false;
  const r=dropRow(b,c); if(r<0){ shakeCol=c; shakeT=Date.now(); sfx.no(); return false; }
  const p=turn; b[idx(r,c)]=p; moves.push(c);
  const y0=cell*0.5,y1=cell*(r+1.5);
  anim.set(idx(r,c),{y:y0,vy:0,ty:y1,bounces:0,r,c,p});
  busy=true; ghost=-1; updateUI();
  return true;
}
function landed(a){
  anim.delete(idx(a.r,a.c)); sfx.land();
  if(anim.size) return;
  busy=false;
  const w=lineAt(b,a.r,a.c);
  if(w){ over=true; winner=a.p; winCells=w; finish(); return; }
  if(!legalCols(b).length){ over=true; winner=0; finish(); return; }
  turn=-a.p; saveGame(); updateUI(); maybeCpu();
}
function maybeCpu(){
  if(over||busy||!isCpuTurn()) return;
  thinking=true; const id=gameId; updateUI();
  setTimeout(()=>{
    if(id!==gameId) return;
    const c=chooseCol(b,turn,cfg.level); thinking=false;
    if(c>=0) play(c);
  },450);
}
function undo(){
  if(busy||thinking||over||!moves.length) return;
  let n=moves.length-1;
  if(cfg.mode==='cpu'){ n=moves.length-1; while(n>0&&((n%2===0?1:-1)!==cfg.color)) n--; if((n%2===0?1:-1)!==cfg.color) return; }
  rebuild(n); saveGame(); updateUI(); maybeCpu();
}
function finish(){
  const sc=getScore(),m=cfg.mode,k=winner===0?'d':(m==='cpu'?(winner===cfg.color?'a':'b'):(winner===1?'a':'b'));
  sc[m][k]++; LS.set(SCK,sc);
  const prev=cfg.level; lvNote='';
  if(m==='cpu'){
    if(k==='a'){ cfg.level=Math.min(7,cfg.level+1); lvNote=cfg.level>prev?'⬆ 컴퓨터가 '+LVE[cfg.level]+' '+cfg.level+'단계로 올라가요!':'🏅 가장 높은 단계예요!'; }
    else if(k==='b'){ cfg.level=Math.max(1,cfg.level-1); if(cfg.level<prev) lvNote='⬇ 컴퓨터가 '+LVE[cfg.level]+' '+cfg.level+'단계로 내려가요'; }
  }
  saveGame(); updateUI();
  const id=gameId; setTimeout(()=>{ if(id===gameId&&over) showEnd(); },1300);
  if(winner!==0){ if(m==='cpu'&&winner!==cfg.color) sfx.lose(); else sfx.win(); }
}

/* ---------- 전적 ---------- */
const SCK='score.connect4';
function getScore(){ const d={cpu:{a:0,b:0,d:0},two:{a:0,b:0,d:0}}; const s=LS.get(SCK,d)||d; s.cpu=s.cpu||d.cpu; s.two=s.two||d.two; return s; }
function renderRec(){
  const r=getScore()[cfg.mode],d=r.d?' · 무 '+r.d:'';
  $('rec').textContent=cfg.mode==='cpu'?'🏆 나 '+r.a+' : '+r.b+' 컴퓨터'+d:'🏆 🔴 '+r.a+' : '+r.b+' 🟡'+d;
}

/* ---------- UI ---------- */
const dot=p=>p===1?'🔴':'🟡';
function resultText(){
  if(winner===0) return '무승부예요';
  if(cfg.mode==='cpu') return winner===cfg.color?'내가 이겼어요! 🎉':'컴퓨터가 이겼어요';
  return dot(winner)+(winner===1?' 빨강':' 노랑')+' 승리! 🎉';
}
function updateUI(){
  let t,sub='';
  if(over) t=resultText();
  else if(cfg.mode==='cpu'){ if(isCpuTurn()) t=dot(turn)+' 컴퓨터가 생각 중… 🤔'; else{ t=dot(turn)+' 내 차례예요!'; sub='줄을 누른 채 옮기고, 놓으면 떨어져요'; } }
  else{ t=dot(turn)+(turn===1?' 빨강':' 노랑')+' 차례예요'; sub='줄을 누른 채 옮기고, 놓으면 떨어져요'; }
  $('status').innerHTML=t+(sub?'<small>'+sub+'</small>':'');
  $('bSound').innerHTML=(muted?'🔇':'🔊')+'<small>'+(muted?'소리 꺼짐':'소리')+'</small>';
  $('bUndo').disabled=busy||thinking||over||!moves.length;
  renderRec();
}
function openOverlay(h,m){ overlayMode=m; const o=$('overlay'); o.innerHTML='<div class="card">'+h+'</div>'; o.className='on'; }
function closeOverlay(){ overlayMode=''; const o=$('overlay'); o.className=''; o.innerHTML=''; }
function chip(k,v,l){ return '<button class="chip'+(cfg[k]===v?' on':'')+'" data-cfg="'+k+'" data-v="'+v+'">'+l+'</button>'; }
function setLv(n){
  cfg.level=n; const t=$('lvthumb'); if(!t) return;
  t.style.left=((n-1)/6*100)+'%'; t.textContent=LVE[n];
  document.querySelectorAll('#lvtrack .dt').forEach((d,i)=>d.classList.toggle('on',i<n));
}
function initLvBar(){
  const tr=$('lvtrack'); if(!tr) return;
  setLv(Math.max(1,Math.min(7,cfg.level)));
  let drag=false;
  const pick=e=>{ const r=tr.getBoundingClientRect(); setLv(Math.max(1,Math.min(7,Math.round((e.clientX-r.left)/r.width*6)+1))); };
  tr.addEventListener('pointerdown',e=>{ drag=true; try{tr.setPointerCapture(e.pointerId);}catch(_){} pick(e); });
  tr.addEventListener('pointermove',e=>{ if(drag) pick(e); });
  ['pointerup','pointercancel'].forEach(ev=>tr.addEventListener(ev,()=>{ drag=false; }));
}
function showMenu(){
  let h='<h1>🔴 Connect 4</h1><div class="sub">네 개를 한 줄로 이으면 이겨요</div>';
  h+='<div class="row"><b>누구랑 할까요?</b><div class="chips">'+chip('mode','cpu','컴퓨터랑')+chip('mode','two','둘이서 같이')+'</div></div>';
  if(cfg.mode==='cpu'){
    h+='<div class="row"><b>컴퓨터 실력</b> <small>이기면 올라가고, 지면 내려가요</small><div class="lvbar"><span>쉬움</span><div id="lvtrack">'+[1,2,3,4,5,6,7].map(n=>'<i class="dt" style="left:'+((n-1)/6*100)+'%"></i>').join('')+'<div id="lvthumb"></div></div><span>어려움</span></div></div>';
    h+='<div class="row"><b>내 색깔</b><div class="chips">'+chip('color',1,'🔴 빨강 (먼저 시작)')+chip('color',-1,'🟡 노랑')+'</div></div>';
  }
  h+='<button class="go" data-act="start">시작하기</button>';
  if(moves.length&&!over) h+='<button class="go alt" data-act="close">계속하던 게임으로</button>';
  h+='<div class="links"><a class="go alt" href="../">🏠 처음</a><a class="go alt" href="../chess/">♟ Chess</a><a class="go alt" href="../algakki/">🪨 알까기</a><a class="go alt" href="../multiply/">✖️ 곱셈</a><a class="go alt" href="../spot/">👀 Spot It</a><a class="go alt" href="../uno/">🃏 UNO</a><a class="go alt" href="../memory/">🧠 Memory</a></div>';
  openOverlay(h,'menu');
  if(cfg.mode==='cpu') initLvBar();
}
function showEnd(){
  let big='🤝'; if(winner!==0) big=(cfg.mode==='cpu'&&winner!==cfg.color)?'🤖':'🏆';
  openOverlay('<div class="big">'+big+'</div><h2>'+resultText()+'</h2>'
    +(lvNote?'<div style="font-size:22px;margin:6px 0">'+lvNote+'</div>':'')
    +'<button class="go" data-act="again">한 판 더</button>'
    +'<button class="go alt" data-act="view">판 보기</button>'
    +'<button class="go alt" data-act="menu">메뉴</button>','end');
}
$('overlay').addEventListener('click',e=>{
  unlock();
  const t=e.target.closest('[data-act],[data-cfg]'); if(!t) return;
  if(t.dataset.cfg){ const k=t.dataset.cfg; cfg[k]=k==='mode'?t.dataset.v:+t.dataset.v; showMenu(); return; }
  const a=t.dataset.act;
  if(a==='start'||a==='again') newGame();
  else if(a==='menu') showMenu();
  else if(a==='close'||a==='view') closeOverlay();
});
$('bUndo').addEventListener('click',undo);
$('bAgain').addEventListener('click',newGame);
$('bMenu').addEventListener('click',showMenu);
$('bSound').addEventListener('click',()=>{ muted=!muted; updateUI(); if(!muted){unlock();sfx.land();} });
let holdT=null; const bP=$('bParent');
bP.addEventListener('pointerdown',()=>{ bP.classList.add('hold'); holdT=setTimeout(()=>{ holdT=null; bP.classList.remove('hold'); Guard.parentFlow(); },900); });
['pointerup','pointerleave','pointercancel'].forEach(ev=>bP.addEventListener(ev,()=>{ clearTimeout(holdT); bP.classList.remove('hold'); }));

/* ---------- 입력: 누른 채 옮기고 놓으면 떨어짐 ---------- */
let pressing=false;
const colAt=e=>{ const r=cv.getBoundingClientRect(); return Math.max(0,Math.min(W-1,Math.floor((e.clientX-r.left)/r.width*W))); };
const canPlay=()=>!over&&!busy&&!thinking&&!overlayMode&&!isCpuTurn();
cv.addEventListener('pointerdown',e=>{ unlock(); if(!canPlay()) return; pressing=true; try{cv.setPointerCapture(e.pointerId);}catch(_){} ghost=colAt(e); });
cv.addEventListener('pointermove',e=>{ if(pressing) ghost=colAt(e); else if(e.pointerType==='mouse'&&canPlay()) ghost=colAt(e); });
cv.addEventListener('pointerup',e=>{ if(!pressing) return; pressing=false; const c=colAt(e); ghost=-1; if(canPlay()) play(c); });
cv.addEventListener('pointercancel',()=>{ pressing=false; ghost=-1; });
cv.addEventListener('pointerleave',()=>{ if(!pressing) ghost=-1; });

/* ---------- 그리기 ---------- */
const COL={1:['#ff8a8a','#d62839'],'-1':['#ffe680','#f0b400']};
function disc(x,y,p,a){
  const r=cell*0.4,g=ctx.createRadialGradient(x-r*.3,y-r*.3,r*.1,x,y,r);
  g.addColorStop(0,COL[p][0]); g.addColorStop(1,COL[p][1]);
  ctx.globalAlpha=a==null?1:a;
  ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fillStyle=g; ctx.fill();
  ctx.lineWidth=cell*0.035; ctx.strokeStyle='rgba(0,0,0,.28)'; ctx.stroke();
  ctx.beginPath(); ctx.arc(x,y,r*.62,0,7); ctx.lineWidth=cell*0.04; ctx.strokeStyle='rgba(255,255,255,.35)'; ctx.stroke();
  ctx.globalAlpha=1;
}
function frame(now){
  const dt=Math.min(.05,(now-(frame.t||now))/1000); frame.t=now;
  for(const a of [...anim.values()]){
    a.vy+=cell*55*dt; a.y+=a.vy*dt;
    if(a.y>=a.ty){
      if(a.bounces<1&&a.vy>cell*3){ a.y=a.ty; a.vy=-a.vy*.3; a.bounces++; }
      else{ a.y=a.ty; landed(a); }
    }
  }
  const S=cv.width; ctx.clearRect(0,0,S,S);
  // 내려가는 중이거나 놓인 말 (판 뒤쪽)
  for(let r=0;r<H;r++) for(let c=0;c<W;c++){
    const p=b[idx(r,c)]; if(!p) continue;
    const a=anim.get(idx(r,c));
    disc((c+.5)*cell,a?a.y:(r+1.5)*cell,p);
  }
  // 미리보기 말
  if(ghost>=0&&canPlay()){ disc((ghost+.5)*cell,cell*.5,turn,.85); }
  // 판
  ctx.save();
  let sx=0; if(shakeCol>=0&&Date.now()-shakeT<350){ sx=Math.sin((Date.now()-shakeT)/25)*cell*.05; } else shakeCol=-1;
  ctx.beginPath(); const rr=cell*.18;
  const x0=0,y0=cell,w=S,h=S-cell;
  ctx.moveTo(x0+rr,y0); ctx.arcTo(x0+w,y0,x0+w,y0+h,rr); ctx.arcTo(x0+w,y0+h,x0,y0+h,rr); ctx.arcTo(x0,y0+h,x0,y0,rr); ctx.arcTo(x0,y0,x0+w,y0,rr); ctx.closePath();
  for(let r=0;r<H;r++) for(let c=0;c<W;c++){ ctx.moveTo((c+.5)*cell+cell*.4,(r+1.5)*cell); ctx.arc((c+.5)*cell,(r+1.5)*cell,cell*.4,0,Math.PI*2,true); }
  const bg=ctx.createLinearGradient(0,y0,0,y0+h); bg.addColorStop(0,'#3b6fe0'); bg.addColorStop(1,'#2149b0');
  ctx.fillStyle=bg; ctx.shadowColor='rgba(0,0,0,.3)'; ctx.shadowBlur=cell*.1; ctx.shadowOffsetY=cell*.05;
  ctx.fill('evenodd'); ctx.restore();
  // 구멍 테두리
  ctx.lineWidth=cell*.03; ctx.strokeStyle='rgba(0,0,30,.35)';
  for(let r=0;r<H;r++) for(let c=0;c<W;c++){ ctx.beginPath(); ctx.arc((c+.5)*cell,(r+1.5)*cell,cell*.4,0,7); ctx.stroke(); }
  // 이긴 네 개 강조
  if(winCells&&!anim.size){
    const k=.5+.5*Math.sin(now/180);
    for(const [r,c] of winCells){ ctx.beginPath(); ctx.arc((c+.5)*cell,(r+1.5)*cell,cell*(.41+.03*k),0,7); ctx.lineWidth=cell*.07; ctx.strokeStyle='rgba(255,255,255,'+(.7+.3*k)+')'; ctx.stroke(); }
  }
  if(shakeCol>=0){ ctx.fillStyle='rgba(255,80,60,.25)'; ctx.fillRect(shakeCol*cell,cell,cell,S-cell); }
  requestAnimationFrame(frame);
}

/* boot */
vh();
const resumed=loadSaved();
if(!resumed){ rebuild(0); moves=[]; }
updateUI();
if(resumed){ maybeCpu(); } else showMenu();
Guard.start({onTick:s=>{ const b2=$('timeBox'); b2.textContent=Guard.label(s); b2.className='box time'+(s<=300?' low':''); },onReset:renderRec});
requestAnimationFrame(frame);
window.__c4={get b(){return b;},get cfg(){return cfg;},get moves(){return moves;},get over(){return over;},get winner(){return winner;},get busy(){return busy;},get turn(){return turn;},chooseCol,newGame,play,lineAt,legalCols,dropRow};
})();
</script>
</body>
</html>
