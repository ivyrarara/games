<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>놀이터</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#121212">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{--f:Lilita,Han,"Jua","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:#121212;color:#fff;font-family:var(--f);
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;color-scheme:dark}
#cluster{position:fixed;inset:5vmin 6vmin;}
.st{position:absolute;left:var(--lx);top:var(--ly);width:var(--ls);height:var(--ls);transform:translate(-50%,-50%) rotate(var(--r,0deg));border-radius:50%;
  display:flex;align-items:center;justify-content:center;text-decoration:none;color:var(--tc,#fff);z-index:var(--z,1);transition:transform .12s}
.st:active{transform:translate(-50%,-50%) rotate(var(--r,0deg)) scale(.93)}
.st svg.shape{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.st svg.deco{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.st .tx{text-shadow:-0.07em 0em var(--halo,transparent),0.07em 0em var(--halo,transparent),0em -0.07em var(--halo,transparent),0em 0.07em var(--halo,transparent),-0.05em -0.05em var(--halo,transparent),0.05em -0.05em var(--halo,transparent),-0.05em 0.05em var(--halo,transparent),0.05em 0.05em var(--halo,transparent);position:relative;text-align:center;line-height:.92;font-size:calc(var(--ls)*var(--fs,.2));letter-spacing:.01em;transform:rotate(var(--tr,0deg))}
.st .tx.han{font-family:Han,var(--f);line-height:1.04;letter-spacing:-.03em}
.fl{position:absolute;left:var(--lx);top:var(--ly);width:var(--ls);height:var(--ls);transform:translate(-50%,-50%) rotate(var(--r,0deg));z-index:var(--z,0);pointer-events:none}
.fl svg{width:100%;height:100%;overflow:visible}
@keyframes bob{
  0%{translate:0 0;rotate:0deg;scale:1}
  25%{translate:var(--ax) var(--ay);rotate:var(--ar);scale:1.02}
  50%{translate:calc(var(--ax)*-.4) calc(var(--ay)*-1);rotate:calc(var(--ar)*-.6);scale:.99}
  75%{translate:calc(var(--ax)*-1) calc(var(--ay)*.5);rotate:calc(var(--ar)*.8);scale:1.015}
  100%{translate:0 0;rotate:0deg;scale:1}
}
.st{animation:bob var(--d,6s) ease-in-out var(--dl,0s) infinite}
@media (prefers-reduced-motion:reduce){.st{animation:none}}
@media (orientation:portrait){
  .st,.fl{left:var(--px,var(--lx));top:var(--py,var(--ly));width:var(--ps,var(--ls));height:var(--ps,var(--ls))}
  .st .tx{font-size:calc(var(--ps,var(--ls))*var(--fs,.2))}
}
</style>
</head>
<body>
<div id="cluster"></div>
<script src="algakki/guard.js"></script>
<script>
const C={pink:'#ff8fd0',yellow:'#ffc400',green:'#2f9b55',blue:'#1f5fd8',lav:'#cdbaf0',orange:'#ff5a14',red:'#ff3d2e',navy:'#14143a'};
const P=(r,n,i)=>[(50+Math.cos(2*Math.PI*i/n-Math.PI/2)*r).toFixed(2),(50+Math.sin(2*Math.PI*i/n-Math.PI/2)*r).toFixed(2)];
function shape(kind,c1,c2,n){
  let s='';
  if(kind==='circle') s=`<circle cx="50" cy="50" r="50" fill="${c1}"/>`;
  if(kind==='flower'){ n=n||8; for(let i=0;i<n;i++){const [x,y]=P(31,n,i);s+=`<circle cx="${x}" cy="${y}" r="19.5" fill="${c1}"/>`;} s+=`<circle cx="50" cy="50" r="33" fill="${c1}"/>`; }
  if(kind==='scallop'){ n=n||14; for(let i=0;i<n;i++){const [x,y]=P(44,n,i);s+=`<circle cx="${x}" cy="${y}" r="7.5" fill="${c1}"/>`;} s+=`<circle cx="50" cy="50" r="44" fill="${c1}"/>`; }
  if(kind==='star'){ n=n||9; const pts=[];for(let i=0;i<n*2;i++){const [x,y]=P(i%2?33:50,n*2,i);pts.push(x+','+y);} s+=`<polygon points="${pts.join(' ')}" fill="${c1}" stroke="${c1}" stroke-width="5" stroke-linejoin="round"/>`; }
  if(c2) s+=`<circle cx="50" cy="50" r="${kind==='star'?25:kind==='scallop'?34:kind==='flower'?27:40}" fill="${c2}"/>`;
  return `<svg class="shape" viewBox="0 0 100 100">${s}</svg>`;
}

/* ---- 게임별 상징 그림 (스티커 가장자리에 붙음) ---- */
const NV=C.navy;
const T=(x,y,r,sc,inner)=>`<g transform="translate(${x} ${y}) rotate(${r||0}) scale(${(sc||1)*.7})">${inner}</g>`;
const stk=(body,fill,out,w)=>`<g fill="${out}" stroke="${out}" stroke-width="${w||3.2}" stroke-linejoin="round" stroke-linecap="round">${body}</g><g fill="${fill}">${body}</g>`;
const BODY={
 pawn:'<circle cx="0" cy="-8" r="5.5"/><path d="M-5.5 11Q-4.5 0 0 -3Q4.5 0 5.5 11Z"/><rect x="-8.5" y="10" width="17" height="5" rx="2.5"/>',
 rook:'<path d="M-9 15H9V10.5H7L6 -3H9V-15H5V-10H2V-15H-2V-10H-5V-15H-9V-3H-6L-7 10.5H-9Z"/>',
 bishop:'<ellipse cx="0" cy="-3" rx="6.5" ry="9.5"/><circle cx="0" cy="-14.5" r="3"/><path d="M-4.5 5H4.5L6 11H-6Z"/><rect x="-9" y="10" width="18" height="5" rx="2.5"/>',
 plus:'<rect x="-3.2" y="-11" width="6.4" height="22" rx="1.5"/><rect x="-11" y="-3.2" width="22" height="6.4" rx="1.5"/>',
 div:'<rect x="-11" y="-3" width="22" height="6" rx="1.5"/><circle cx="0" cy="-9" r="3.8"/><circle cx="0" cy="9" r="3.8"/>',
 eq:'<rect x="-11" y="-8" width="22" height="5.4" rx="1.5"/><rect x="-11" y="2.6" width="22" height="5.4" rx="1.5"/>'
};
BODY.times=`<g transform="rotate(45)">${BODY.plus}</g>`;
const piece=(k,x,y,r,sc,fill,out)=>T(x,y,r,sc,stk(BODY[k],fill,out));
const stone=(x,y,r,white)=>T(x,y,0,1,`<circle r="${r+2.2}" fill="${white?NV:'#fff'}" opacity="${white?.0:1}"/><circle r="${r}" fill="${white?'#f6f2ea':'#1b1b22'}" stroke="${white?NV:'#fff'}" stroke-width="1.4"/><ellipse cx="${-r*.3}" cy="${-r*.35}" rx="${r*.35}" ry="${r*.22}" fill="#fff" opacity="${white?.0:.28}" transform="rotate(-30 ${-r*.3} ${-r*.35})"/><path d="M${-r*.55} ${r*.45}A${r*.75} ${r*.75} 0 0 0 ${r*.55} ${r*.45}" fill="none" stroke="${white?'#cfc7b8':'#fff'}" stroke-width="1.6" opacity="${white?1:.0}" stroke-linecap="round"/>`);
const chip=(x,y,r,col)=>T(x,y,0,1,`<circle r="${r}" fill="${col}" stroke="${NV}" stroke-width="1.6"/><circle r="${r*.62}" fill="none" stroke="rgba(0,0,0,.28)" stroke-width="1.8"/><circle r="${r*.62}" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="1" transform="translate(-.8 -.8)"/>`);
const eye=(x,y,r,col,dx,dy)=>T(x,y,0,1,`<circle r="${r}" fill="#fff" stroke="${NV}" stroke-width="2.6"/><circle cx="${dx}" cy="${dy}" r="${r*.55}" fill="${col}"/><circle cx="${dx*1.25}" cy="${dy*1.25}" r="${r*.27}" fill="${NV}"/><circle cx="${dx-r*.15}" cy="${dy-r*.22}" r="${r*.13}" fill="#fff"/>`);
const eyes=(x,y,sc,lx)=>T(x,y,0,sc,[-10.5,10.5].map(c=>`<ellipse cx="${c}" rx="11.5" ry="14.5" fill="#fff" stroke="${NV}" stroke-width="5.4"/>`).join('')+[-10.5,10.5].map(c=>`<ellipse cx="${c}" rx="11.5" ry="14.5" fill="#fff" stroke="${C.blue}" stroke-width="3"/>`).join('')+[-10.5,10.5].map(c=>`<ellipse cx="${c+lx}" cy="1.5" rx="4.6" ry="8" fill="${NV}"/><circle cx="${c+lx-1.3}" cy="-3.2" r="1.9" fill="#fff"/>`).join(''));
const ucard=(x,y,r,sc,col)=>T(x,y,r,sc,`<rect x="-9.5" y="-13.5" width="19" height="27" rx="3.4" fill="#fff" stroke="${NV}" stroke-width="1.3"/><rect x="-7.3" y="-11.3" width="14.6" height="22.6" rx="2.2" fill="${col}"/><ellipse rx="5.2" ry="9" fill="#fff" transform="rotate(28)"/>`);
const MONS=(c)=>`<circle cy="3" r="6.2" fill="${c}"/><circle cx="-2.4" cy="1.4" r="1.9" fill="#fff"/><circle cx="2.4" cy="1.4" r="1.9" fill="#fff"/><circle cx="-2.4" cy="1.6" r=".9" fill="${NV}"/><circle cx="2.4" cy="1.6" r=".9" fill="${NV}"/><path d="M-3 5.2Q0 7.2 3 5.2" fill="none" stroke="${NV}" stroke-width=".9" stroke-linecap="round"/><path d="M-4 -2.6L-3 -6.4L-1 -3M4 -2.6L3 -6.4L1 -3" fill="${c}"/>`;
const STAR='<polygon points="0,-6.4 1.9,-2 6.4,-1.8 2.9,1.1 4,5.6 0,3.1 -4,5.6 -2.9,1.1 -6.4,-1.8 -1.9,-2" fill="#ffc400"/>';
const mcard=(x,y,r,sc,face)=>T(x,y,r,sc,`<rect x="-9.5" y="-13.5" width="19" height="27" rx="3.4" fill="#fff" stroke="${NV}" stroke-width="1.3"/><rect x="-7.3" y="-11.3" width="14.6" height="22.6" rx="2.2" fill="${face?'#e9ddfa':NV}"/>${face?MONS(face):STAR}`);
/* 게임 하나 = 스티커 하나. lx/ly: 가로 화면 위치, px/py: 세로 화면 위치 */
const G=[
 {d:()=>piece('pawn',17,74,-8,1.15,NV,'#fff')+piece('rook',82,34,8,1.15,NV,'#fff'),h:'chess/',   t:'Chess',        k:'circle', c1:C.pink,  tc:'#fff',  fs:.27, r:-6, tr:-8, lx:'18%',ly:'28%',ls:'44vmin',px:'30%',py:'14%',ps:'44vmin',z:2},
 {d:()=>stone(22,66,11,0)+stone(80,70,10,1),h:'algakki/', t:'알까기',        k:'scallop',c1:C.green, tc:'#fff',  fs:.27, r:4,  tr:6,  han:1,lx:'42%',ly:'22%',ls:'36vmin',px:'72%',py:'20%',ps:'38vmin',z:3},
 {d:()=>piece('times',22,30,0,1.05,C.orange,'#fff')+piece('plus',80,70,0,1.05,C.green,'#fff'),h:'multiply/',t:'곱셈<br>몬스터', k:'flower', c1:C.lav,   c2:C.blue,tc:'#fff',fs:.17,r:-3,tr:-6,han:1,lx:'66%',ly:'30%',ls:'44vmin',px:'30%',py:'35%',ps:'46vmin',z:2},
 {d:()=>chip(24,60,11.5,C.red)+chip(76,68,11,C.blue),h:'connect4/',t:'Connect<br>4', k:'circle', c1:C.yellow,tc:C.navy,fs:.2,  r:8,  tr:10, lx:'88%',ly:'26%',ls:'36vmin',px:'74%',py:'45%',ps:'38vmin',z:3},
 {d:()=>eyes(50,21,.95,3),h:'spot/',    t:'Spot<br>it!',  k:'star',   c1:C.orange,c2:C.yellow,tc:C.navy,fs:.2,r:-8,tr:-10,lx:'16%',ly:'76%',ls:'40vmin',px:'24%',py:'60%',ps:'40vmin',z:2},
 {d:()=>ucard(22,71,-14,1.05,C.red)+ucard(80,27,16,1.05,C.green),h:'uno/',     t:'UNO',          k:'scallop',c1:C.blue,  c2:C.yellow,tc:C.navy,  fs:.28, r:-5, tr:-7, lx:'40%',ly:'76%',ls:'44vmin',px:'68%',py:'66%',ps:'44vmin',z:3},
 {d:()=>mcard(30,26,-12,1.0,0)+mcard(72,78,10,1.0,C.orange),h:'memory/',  halo:'transparent',t:'Memory',       k:'flower', c1:C.pink,  c2:C.green,tc:'#fff', fs:.15, r:6,  tr:8,  lx:'66%',ly:'76%',ls:'42vmin',px:'30%',py:'84%',ps:'42vmin',z:2}
];
/* 장식 (눌러도 아무 일 없음) */
const F=[
 {k:'flower',c1:C.yellow,c2:C.blue,  n:8, lx:'29%',ly:'55%',ls:'15vmin',r:12, z:1,px:'8%', py:'34%',ps:'16vmin'},
 {k:'star',  c1:C.yellow,c2:C.orange,n:8, lx:'54%',ly:'50%',ls:'14vmin',r:0,  z:1,px:'52%',py:'30%',ps:'14vmin'},
 {k:'flower',c1:C.lav,   c2:C.blue,  n:6, lx:'89%',ly:'58%',ls:'18vmin',r:-8, z:1,px:'90%',py:'66%',ps:'18vmin'},
 {k:'flower',c1:C.green, c2:C.pink,  n:7, lx:'6%', ly:'55%',ls:'16vmin',r:20, z:1,px:'12%',py:'92%',ps:'16vmin'},
 {k:'circle',c1:C.orange,c2:C.yellow,        lx:'90%',ly:'92%',ls:'11vmin',r:0,  z:1,px:'92%',py:'8%', ps:'11vmin'},
 {k:'star',  c1:C.green, c2:C.pink,  n:10,lx:'52%',ly:'96%',ls:'13vmin',r:0,  z:1,px:'56%',py:'96%',ps:'13vmin'}
];
const box=document.getElementById('cluster');
let _i=0;const rnd=(a,b)=>a+Math.random()*(b-a);
function wob(el){_i++;const sg=_i%2?1:-1;
  el.style.setProperty('--d',rnd(5,8.5).toFixed(2)+'s');el.style.setProperty('--dl',(-rnd(0,8)).toFixed(2)+'s');
  el.style.setProperty('--ax',(sg*rnd(.5,1.1)).toFixed(2)+'vmin');el.style.setProperty('--ay',(-sg*rnd(.5,1.2)).toFixed(2)+'vmin');
  el.style.setProperty('--ar',(sg*rnd(1.8,3.6)).toFixed(2)+'deg');}
F.forEach(f=>{const d=document.createElement('div');d.className='fl';d.style.cssText=`--lx:${f.lx};--ly:${f.ly};--ls:${f.ls};--px:${f.px};--py:${f.py};--ps:${f.ps};--r:${f.r}deg;--z:${f.z}`;d.innerHTML=shape(f.k,f.c1,f.c2,f.n);wob(d);box.appendChild(d);});
G.forEach(g=>{const a=document.createElement('a');a.className='st';a.href=g.h;
  a.style.cssText=`--lx:${g.lx};--ly:${g.ly};--ls:${g.ls};--px:${g.px};--py:${g.py};--ps:${g.ps};--r:${g.r}deg;--tr:${g.tr}deg;--tc:${g.tc};--fs:${g.fs};--z:${g.z};--halo:${g.halo||g.c2||g.c1}`;
  a.innerHTML=shape(g.k,g.c1,g.c2)+`<svg class="deco" viewBox="0 0 100 100">${g.d()}</svg>`+`<span class="tx${g.han?' han':''}">${g.t}</span>`;wob(a);box.appendChild(a);});
Guard.start({hub:true});
addEventListener('pageshow',e=>{ if(e.persisted) Guard.start({hub:true}); });
if('serviceWorker' in navigator&&location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
