<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>놀이터</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#121212">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{--f:Lilita,Han,"Jua","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:#121212;color:#fff;font-family:var(--f);
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;color-scheme:dark}
#cluster{position:fixed;inset:5vmin 6vmin;}
.st{position:absolute;left:var(--lx);top:var(--ly);width:var(--ls);height:var(--ls);transform:translate(-50%,-50%) rotate(var(--r,0deg));border-radius:50%;
  display:flex;align-items:center;justify-content:center;text-decoration:none;color:var(--tc,#fff);z-index:var(--z,1);transition:transform .12s}
.st:active{transform:translate(-50%,-50%) rotate(var(--r,0deg)) scale(.93)}
.st svg.shape{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.st .tx{position:relative;text-align:center;line-height:.92;font-size:calc(var(--ls)*var(--fs,.2));letter-spacing:.01em;transform:rotate(var(--tr,0deg))}
.st .tx.han{font-family:Han,var(--f);line-height:1.04;letter-spacing:-.03em}
.fl{position:absolute;left:var(--lx);top:var(--ly);width:var(--ls);height:var(--ls);transform:translate(-50%,-50%) rotate(var(--r,0deg));z-index:var(--z,0);pointer-events:none}
.fl svg{width:100%;height:100%;overflow:visible}
@media (orientation:portrait){
  .st,.fl{left:var(--px,var(--lx));top:var(--py,var(--ly));width:var(--ps,var(--ls));height:var(--ps,var(--ls))}
  .st .tx{font-size:calc(var(--ps,var(--ls))*var(--fs,.2))}
}
</style>
</head>
<body>
<div id="cluster"></div>
<script>
const C={pink:'#ff8fd0',yellow:'#ffc400',green:'#2f9b55',blue:'#1f5fd8',lav:'#cdbaf0',orange:'#ff5a14',red:'#ff3d2e',navy:'#14143a'};
const P=(r,n,i)=>[(50+Math.cos(2*Math.PI*i/n-Math.PI/2)*r).toFixed(2),(50+Math.sin(2*Math.PI*i/n-Math.PI/2)*r).toFixed(2)];
function shape(kind,c1,c2,n){
  let s='';
  if(kind==='circle') s=`<circle cx="50" cy="50" r="50" fill="${c1}"/>`;
  if(kind==='flower'){ n=n||8; for(let i=0;i<n;i++){const [x,y]=P(31,n,i);s+=`<circle cx="${x}" cy="${y}" r="19.5" fill="${c1}"/>`;} s+=`<circle cx="50" cy="50" r="33" fill="${c1}"/>`; }
  if(kind==='scallop'){ n=n||14; for(let i=0;i<n;i++){const [x,y]=P(44,n,i);s+=`<circle cx="${x}" cy="${y}" r="7.5" fill="${c1}"/>`;} s+=`<circle cx="50" cy="50" r="44" fill="${c1}"/>`; }
  if(kind==='star'){ n=n||9; const pts=[];for(let i=0;i<n*2;i++){const [x,y]=P(i%2?33:50,n*2,i);pts.push(x+','+y);} s+=`<polygon points="${pts.join(' ')}" fill="${c1}" stroke="${c1}" stroke-width="5" stroke-linejoin="round"/>`; }
  if(c2) s+=`<circle cx="50" cy="50" r="${kind==='star'?25:kind==='scallop'?34:kind==='flower'?27:40}" fill="${c2}"/>`;
  return `<svg class="shape" viewBox="0 0 100 100">${s}</svg>`;
}
/* 게임 하나 = 스티커 하나. lx/ly: 가로 화면 위치, px/py: 세로 화면 위치 */
const G=[
 {h:'chess/',   t:'Chess',        k:'circle', c1:C.pink,  tc:'#fff',  fs:.27, r:-6, tr:-8, lx:'18%',ly:'28%',ls:'44vmin',px:'30%',py:'14%',ps:'44vmin',z:2},
 {h:'algakki/', t:'알까기',        k:'scallop',c1:C.green, tc:'#fff',  fs:.27, r:4,  tr:6,  han:1,lx:'42%',ly:'22%',ls:'36vmin',px:'72%',py:'20%',ps:'38vmin',z:3},
 {h:'multiply/',t:'곱셈<br>몬스터', k:'flower', c1:C.lav,   c2:C.blue,tc:'#fff',fs:.17,r:-3,tr:-6,han:1,lx:'66%',ly:'30%',ls:'44vmin',px:'30%',py:'35%',ps:'46vmin',z:2},
 {h:'connect4/',t:'Connect<br>4', k:'circle', c1:C.yellow,tc:C.navy,fs:.2,  r:8,  tr:10, lx:'88%',ly:'26%',ls:'36vmin',px:'74%',py:'45%',ps:'38vmin',z:3},
 {h:'spot/',    t:'Spot<br>it!',  k:'star',   c1:C.orange,c2:C.yellow,tc:C.navy,fs:.2,r:-8,tr:-10,lx:'16%',ly:'76%',ls:'40vmin',px:'24%',py:'60%',ps:'40vmin',z:2},
 {h:'uno/',     t:'UNO',          k:'scallop',c1:C.pink,  c2:C.blue,tc:'#fff',  fs:.28, r:-5, tr:-7, lx:'40%',ly:'76%',ls:'44vmin',px:'68%',py:'66%',ps:'44vmin',z:3},
 {h:'memory/',  t:'Memory',       k:'flower', c1:C.pink,  c2:C.green,tc:'#fff', fs:.15, r:6,  tr:8,  lx:'66%',ly:'76%',ls:'42vmin',px:'30%',py:'84%',ps:'42vmin',z:2}
];
/* 장식 (눌러도 아무 일 없음) */
const F=[
 {k:'flower',c1:C.pink,  c2:C.green, n:8, lx:'29%',ly:'55%',ls:'15vmin',r:12, z:1,px:'8%', py:'34%',ps:'16vmin'},
 {k:'star',  c1:C.yellow,c2:C.orange,n:8, lx:'54%',ly:'50%',ls:'14vmin',r:0,  z:1,px:'52%',py:'30%',ps:'14vmin'},
 {k:'flower',c1:C.lav,   c2:C.blue,  n:6, lx:'89%',ly:'58%',ls:'18vmin',r:-8, z:1,px:'90%',py:'66%',ps:'18vmin'},
 {k:'flower',c1:C.green, c2:C.pink,  n:7, lx:'6%', ly:'55%',ls:'16vmin',r:20, z:1,px:'12%',py:'92%',ps:'16vmin'},
 {k:'circle',c1:C.orange,c2:C.yellow,        lx:'90%',ly:'92%',ls:'11vmin',r:0,  z:1,px:'92%',py:'8%', ps:'11vmin'},
 {k:'star',  c1:C.blue,  c2:C.yellow,n:10,lx:'52%',ly:'96%',ls:'13vmin',r:0,  z:1,px:'56%',py:'96%',ps:'13vmin'}
];
const box=document.getElementById('cluster');
F.forEach(f=>{const d=document.createElement('div');d.className='fl';d.style.cssText=`--lx:${f.lx};--ly:${f.ly};--ls:${f.ls};--px:${f.px};--py:${f.py};--ps:${f.ps};--r:${f.r}deg;--z:${f.z}`;d.innerHTML=shape(f.k,f.c1,f.c2,f.n);box.appendChild(d);});
G.forEach(g=>{const a=document.createElement('a');a.className='st';a.href=g.h;
  a.style.cssText=`--lx:${g.lx};--ly:${g.ly};--ls:${g.ls};--px:${g.px};--py:${g.py};--ps:${g.ps};--r:${g.r}deg;--tr:${g.tr}deg;--tc:${g.tc};--fs:${g.fs};--z:${g.z}`;
  a.innerHTML=shape(g.k,g.c1,g.c2)+`<span class="tx${g.han?' han':''}">${g.t}</span>`;box.appendChild(a);});
if('serviceWorker' in navigator&&location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
