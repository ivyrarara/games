<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>놀이터</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2b2250">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Lilita+One&family=Fredoka:wght@700&family=Bangers&family=Playfair+Display:wght@900&display=swap">
<style>
:root{--vh:1vh;--jua:"Jua","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:#2b2250;color:#fff;font-family:var(--jua);
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;color-scheme:dark}
body{background:radial-gradient(circle at 20% 0%,#4a3a8c 0,#2b2250 55%,#1d1740 100%)}
#app{height:calc(var(--vh)*100);display:flex;flex-direction:column;padding:calc(var(--vh)*2.5) 16px calc(var(--vh)*3);gap:calc(var(--vh)*2)}
h1{margin:0;text-align:center;font-weight:400;font-size:calc(var(--vh)*6);line-height:1.1;letter-spacing:1px;text-shadow:0 3px 0 rgba(0,0,0,.35)}
#grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:calc(var(--vh)*2.5) 14px}
.tile{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:24px;text-decoration:none;color:#fff;
  border:4px solid rgba(255,255,255,.9);box-shadow:0 7px 0 rgba(0,0,0,.35);min-height:0;transition:transform .08s}
.tile:active{transform:translateY(5px);box-shadow:0 2px 0 rgba(0,0,0,.35)}
.tile>*{position:relative;z-index:1}
.logo{line-height:.95;text-align:center}
.tag{position:absolute!important;left:50%;bottom:calc(var(--vh)*1.6);transform:translateX(-50%);white-space:nowrap;font-size:calc(var(--vh)*2.9);background:rgba(0,0,0,.45);border-radius:999px;padding:2px 14px;z-index:2}
.deco{position:absolute!important;z-index:0!important;pointer-events:none}
.fs{font-size:calc(var(--vh)*10)}

/* ---- CHESS ---- */
.t-chess{background:conic-gradient(#5b3a1e 25%,#e8d0a0 0 50%,#5b3a1e 0 75%,#e8d0a0 0) 0 0/calc(var(--vh)*9) calc(var(--vh)*9)}
.t-chess::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(20,12,5,.1) 0,rgba(20,12,5,.7) 85%)}
.t-chess .logo{font-family:"Playfair Display",Georgia,serif;font-weight:900;font-size:calc(var(--vh)*10.5);letter-spacing:.06em;
  background:linear-gradient(#fff3b0,#f0b429 55%,#a8700f);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 3px 0 #2a1708) drop-shadow(0 0 8px rgba(0,0,0,.6))}
.t-chess .pc{font-size:calc(var(--vh)*13);line-height:1;color:#ffe08a;text-shadow:0 3px 0 #2a1708,0 0 10px rgba(0,0,0,.7);margin-bottom:calc(var(--vh)*.5)}

/* ---- CONNECT 4 ---- */
.t-c4{background:#1f4fd6}
.t-c4::before{content:'';position:absolute;inset:0;background:radial-gradient(circle,#0e2e8f 0 38%,transparent 40%) 0 0/calc(var(--vh)*6.4) calc(var(--vh)*6.4);opacity:.9}
.t-c4 .logo{font-family:Fredoka,"Jua",sans-serif;font-weight:700;font-size:calc(var(--vh)*6.6);letter-spacing:.02em;color:#fff;-webkit-text-stroke:calc(var(--vh)*.9) #0a2275;paint-order:stroke fill;text-shadow:0 5px 0 #0a2275}
.t-c4 .four{display:inline-flex;align-items:center;justify-content:center;width:calc(var(--vh)*11);height:calc(var(--vh)*11);border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffec6a,#f5b800);
  color:#d3262b;font-family:Fredoka,sans-serif;font-weight:700;font-size:calc(var(--vh)*8.5);-webkit-text-stroke:0;text-shadow:none;box-shadow:inset 0 -5px 0 rgba(0,0,0,.2),0 4px 0 #0a2275;margin-top:calc(var(--vh)*.8);border:3px solid #fff}
.t-c4 .d{position:absolute;width:calc(var(--vh)*6);height:calc(var(--vh)*6);border-radius:50%;box-shadow:inset 0 -4px 0 rgba(0,0,0,.22);border:2px solid rgba(255,255,255,.7)}
.t-c4 .r{background:radial-gradient(circle at 35% 30%,#ff7b7b,#d3262b)}.t-c4 .y{background:radial-gradient(circle at 35% 30%,#ffec6a,#f5b800)}

/* ---- SPOT IT ---- */
.t-spot{background:radial-gradient(circle at 50% 40%,#ff7ac6 0,#a24bd8 55%,#5a2bb0 100%)}
.t-spot .logo{font-family:Bangers,"Jua",cursive;font-size:calc(var(--vh)*11);letter-spacing:.04em;color:#fff35c;-webkit-text-stroke:calc(var(--vh)*.9) #4a1796;paint-order:stroke fill;text-shadow:0 5px 0 #4a1796;transform:rotate(-4deg)}
.t-spot .ring{position:absolute;inset:7% 8%;border:calc(var(--vh)*.8) dashed rgba(255,255,255,.55);border-radius:50%}
.t-spot .e{position:absolute;font-size:calc(var(--vh)*6.4);filter:drop-shadow(0 3px 0 rgba(0,0,0,.25))}

/* ---- UNO ---- */
.t-uno{background:radial-gradient(circle at 50% 45%,#ff5a4f 0,#d6211c 70%,#a31510 100%)}
.t-uno .logo{font-family:"Lilita One","Jua",sans-serif;font-size:calc(var(--vh)*17);letter-spacing:.03em;color:#fff;-webkit-text-stroke:calc(var(--vh)*1.1) #14141a;paint-order:stroke fill;text-shadow:calc(var(--vh)*.7) calc(var(--vh)*.9) 0 #14141a;transform:rotate(-7deg) skewX(-6deg)}
.t-uno .oval{position:absolute;width:78%;height:60%;left:11%;top:12%;background:#ffd400;border-radius:50%;transform:rotate(-14deg);box-shadow:0 0 0 calc(var(--vh)*.9) #14141a inset}
.t-uno .cd{position:absolute;width:calc(var(--vh)*7);height:calc(var(--vh)*10.5);border-radius:9px;border:3px solid #fff;box-shadow:0 3px 6px rgba(0,0,0,.4)}

/* ---- 알까기 ---- */
.t-alg{background:repeating-linear-gradient(0deg,transparent 0 calc(var(--vh)*5.5),rgba(80,45,10,.35) calc(var(--vh)*5.5) calc(var(--vh)*5.7)),repeating-linear-gradient(90deg,transparent 0 calc(var(--vh)*5.5),rgba(80,45,10,.35) calc(var(--vh)*5.5) calc(var(--vh)*5.7)),#e3b868}
.t-alg .logo{font-family:var(--jua);font-size:calc(var(--vh)*10);color:#fff;-webkit-text-stroke:calc(var(--vh)*1.1) #3b2209;paint-order:stroke fill;text-shadow:0 5px 0 #3b2209;transform:rotate(3deg)}
.t-alg .st{position:absolute;border-radius:50%;box-shadow:inset 0 -5px 0 rgba(0,0,0,.25),0 4px 0 rgba(0,0,0,.3)}
.t-alg .b{background:radial-gradient(circle at 35% 30%,#5a5a62,#111)}.t-alg .w{background:radial-gradient(circle at 35% 30%,#fff,#cfcfd6)}
.t-alg .pow{position:absolute;font-size:calc(var(--vh)*7)}

/* ---- 곱셈 몬스터 ---- */
.t-mul{background:radial-gradient(circle at 50% 35%,#8be04e 0,#3bb54a 60%,#1f7d37 100%)}
.t-mul .x{position:absolute;font-family:"Lilita One",sans-serif;font-size:calc(var(--vh)*30);color:rgba(255,255,255,.18);line-height:1}
.t-mul .logo{font-family:var(--jua);font-size:calc(var(--vh)*7);color:#ffef5e;-webkit-text-stroke:calc(var(--vh)*.9) #0f4a1e;paint-order:stroke fill;text-shadow:0 5px 0 #0f4a1e}
.t-mul .eyes{display:flex;gap:calc(var(--vh)*1.2);margin-bottom:calc(var(--vh)*.8)}
.t-mul .eye{width:calc(var(--vh)*8);height:calc(var(--vh)*8);border-radius:50%;background:#fff;border:3px solid #0f4a1e;position:relative;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.t-mul .eye::after{content:'';position:absolute;width:42%;height:42%;border-radius:50%;background:#1a1a22;left:36%;top:32%}
.t-mul .eye:nth-child(2){transform:scale(.8) translateY(calc(var(--vh)*1))}
.t-mul .horn{position:absolute;width:0;height:0;border-left:calc(var(--vh)*2) solid transparent;border-right:calc(var(--vh)*2) solid transparent;border-bottom:calc(var(--vh)*6) solid #ffef5e}

@media (orientation:portrait){
  #grid{grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(3,1fr)}
  h1{font-size:calc(var(--vh)*4.4)}
  .tag{font-size:calc(var(--vh)*2)}
  .t-chess .logo{font-size:calc(var(--vh)*6.5)}.t-chess .pc{font-size:calc(var(--vh)*8)}
  .t-c4 .logo{font-size:calc(var(--vh)*4)}.t-c4 .four{width:calc(var(--vh)*7);height:calc(var(--vh)*7);font-size:calc(var(--vh)*5.5)}
  .t-spot .logo{font-size:calc(var(--vh)*7)}.t-uno .logo{font-size:calc(var(--vh)*10.5)}
  .t-alg .logo{font-size:calc(var(--vh)*6.5)}.t-mul .logo{font-size:calc(var(--vh)*4.4)}
  .t-mul .eye{width:calc(var(--vh)*5);height:calc(var(--vh)*5)}
}
</style>
</head>
<body>
<div id="app">
  <h1>🎮 뭐 하고 놀까?</h1>
  <nav id="grid">
    <a class="tile t-chess" href="chess/">
      <span class="pc">♞ ♛ ♞</span><span class="logo">CHESS</span><span class="tag">컴퓨터와 대결</span>
    </a>
    <a class="tile t-alg" href="algakki/">
      <i class="st b deco" style="width:calc(var(--vh)*9);height:calc(var(--vh)*9);left:6%;top:12%"></i>
      <i class="st w deco" style="width:calc(var(--vh)*9);height:calc(var(--vh)*9);right:6%;top:8%"></i>
      <i class="st b deco" style="width:calc(var(--vh)*7);height:calc(var(--vh)*7);right:14%;bottom:24%"></i>
      <span class="pow deco" style="left:30%;top:6%">💥</span>
      <span class="logo">알까기</span><span class="tag">튕겨서 밀어내기</span>
    </a>
    <a class="tile t-mul" href="multiply/">
      <span class="x deco" style="right:-4%;top:-6%">×</span>
      <span class="eyes"><i class="eye"></i><i class="eye"></i></span>
      <span class="logo">곱셈 몬스터</span><span class="tag">숙제 · 연습</span>
    </a>
    <a class="tile t-c4" href="connect4/">
      <i class="d r" style="left:7%;top:10%"></i><i class="d y" style="right:8%;top:14%"></i><i class="d y" style="left:12%;bottom:22%"></i><i class="d r" style="right:10%;bottom:20%"></i>
      <span class="logo">CONNECT<br><span class="four">4</span></span><span class="tag">네 개 먼저 잇기</span>
    </a>
    <a class="tile t-spot" href="spot/">
      <i class="ring deco"></i>
      <span class="e deco" style="left:8%;top:10%">🐶</span><span class="e deco" style="right:9%;top:8%">🍕</span>
      <span class="e deco" style="left:12%;bottom:20%">🚀</span><span class="e deco" style="right:10%;bottom:22%">🍩</span>
      <span class="logo">SPOT<br>IT!</span><span class="tag">컴퓨터보다 먼저</span>
    </a>
    <a class="tile t-uno" href="uno/">
      <i class="oval deco"></i>
      <i class="cd deco" style="background:#1e6fd9;left:7%;bottom:14%;transform:rotate(-24deg)"></i>
      <i class="cd deco" style="background:#3d9c4a;left:15%;bottom:11%;transform:rotate(-10deg)"></i>
      <i class="cd deco" style="background:#f6c90e;right:15%;bottom:11%;transform:rotate(10deg)"></i>
      <i class="cd deco" style="background:#14141a;right:7%;bottom:14%;transform:rotate(24deg)"></i>
      <span class="logo" style="margin-bottom:calc(var(--vh)*3)">UNO</span><span class="tag">기본 · 플립</span>
    </a>
  </nav>
</div>
<script>
function vh(){document.documentElement.style.setProperty('--vh',(window.innerHeight/100)+'px');}
vh();window.addEventListener('resize',vh);
if('serviceWorker' in navigator&&location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
