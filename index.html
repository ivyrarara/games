<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>놀이터</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f4ecd8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
:root{--ink:#2a2a33;--vh:1vh;--font:"Jua","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:#f4ecd8;color:var(--ink);font-family:var(--font);
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;color-scheme:light}
#app{height:calc(var(--vh)*100);display:flex;flex-direction:column;padding:calc(var(--vh)*3) 18px calc(var(--vh)*3);gap:calc(var(--vh)*2.5)}
h1{margin:0;text-align:center;font-weight:400;font-size:calc(var(--vh)*7);line-height:1.1}
#grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:calc(var(--vh)*2.5) 16px}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--vh)*1);border-radius:26px;text-decoration:none;color:var(--ink);
  background:var(--c);box-shadow:0 7px 0 var(--d);border:4px solid #fff;min-height:0;padding:6px;text-align:center}
.tile:active{transform:translateY(5px);box-shadow:0 2px 0 var(--d)}
.tile .em{font-size:calc(var(--vh)*17);line-height:1}
.tile .nm{font-size:calc(var(--vh)*5.6);line-height:1.1}
.tile .ds{font-size:calc(var(--vh)*3);opacity:.7;line-height:1.1}
@media (orientation:portrait){
  #grid{grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(3,1fr)}
  h1{font-size:calc(var(--vh)*5)}
  .tile .em{font-size:calc(var(--vh)*10)}.tile .nm{font-size:calc(var(--vh)*3.6)}.tile .ds{font-size:calc(var(--vh)*2.2)}
}
</style>
</head>
<body>
<div id="app">
  <h1>🎮 뭐 하고 놀까?</h1>
  <nav id="grid">
    <a class="tile" href="chess/"    style="--c:#fde9b8;--d:#d9b45f"><span class="em">♟️</span><span class="nm">체스</span><span class="ds">컴퓨터와 대결</span></a>
    <a class="tile" href="algakki/"  style="--c:#d9e8f7;--d:#8fb2d6"><span class="em">🪨</span><span class="nm">알까기</span><span class="ds">튕겨서 밀어내기</span></a>
    <a class="tile" href="multiply/" style="--c:#d8f0d2;--d:#8fc487"><span class="em">👾</span><span class="nm">곱셈 몬스터</span><span class="ds">숙제 · 연습</span></a>
    <a class="tile" href="connect4/" style="--c:#fbd5d0;--d:#df9189"><span class="em">🔴</span><span class="nm">사목</span><span class="ds">네 개 먼저 잇기</span></a>
    <a class="tile" href="spot/"     style="--c:#e6dcf7;--d:#b39fdb"><span class="em">👀</span><span class="nm">같은 그림 찾기</span><span class="ds">컴퓨터보다 먼저</span></a>
    <a class="tile" href="uno/"      style="--c:#fff1a8;--d:#d9c45a"><span class="em">🃏</span><span class="nm">우노</span><span class="ds">기본 · 플립</span></a>
  </nav>
</div>
<script>
function vh(){document.documentElement.style.setProperty('--vh',(window.innerHeight/100)+'px');}
vh();window.addEventListener('resize',vh);
if('serviceWorker' in navigator&&location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
